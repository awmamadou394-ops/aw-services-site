<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Mon Espace Chauffeur</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .aw-header { display: flex; justify-content: space-between; align-items: center; text-align: left; }
  .aw-header h1 { font-size: 18px; }
  .deconnexion { background-color: transparent; border: 1px solid var(--alerte); color: var(--alerte); padding: 8px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 600; font-family: var(--police-texte); }
  .chargement { text-align: center; padding: 40px; color: var(--texte-doux); }

  .msg-zone { font-size: 13px; margin-top: 8px; }
  .msg-zone.ok { color: var(--succes); }
  .msg-zone.err { color: var(--alerte); }

  .reservation-carte {
    background-color: var(--fond);
    border: 1px solid var(--bordure);
    border-radius: var(--rayon-petit);
    padding: 12px;
    cursor: pointer;
    text-align: center;
    font-family: var(--police-chiffres);
    font-weight: 700;
    transition: transform 0.1s ease, border-color 0.1s ease;
  }
  .reservation-carte:active { transform: scale(0.96); border-color: var(--accent); }
  .grille-reservations { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-maps { display: inline-block; background-color: var(--accent); color: #1C1200; text-decoration: none; padding: 10px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 700; margin-top: 10px; }
  .direction-choix { display: flex; gap: 8px; margin-top: 8px; margin-bottom: 8px; }
  .btn-direction { flex: 1; background-color: var(--fond); border: 1px solid var(--bordure); color: var(--texte-doux); padding: 11px; border-radius: var(--rayon-petit); font-size: 12px; font-weight: 600; }
  .btn-direction.actif { background-color: var(--accent-fonce); border-color: var(--accent); color: var(--texte); }

  .titre-date { color: var(--accent); font-size: 13px; font-weight: 700; margin-top: 14px; margin-bottom: 8px; font-family: var(--police-titre); cursor: pointer; display: flex; align-items: center; justify-content: space-between; background-color: var(--fond); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 10px 12px; }

  .accordeon-contenu { display: none; margin-top: 10px; }
  .accordeon-contenu.ouvert { display: block; }
  .accordeon-titre .fleche { display: inline-block; transition: transform 0.15s ease; color: var(--accent); }
  .accordeon-titre.ouvert .fleche { transform: rotate(180deg); }

  .groupe-date-contenu { display: none; margin-top: 8px; margin-bottom: 4px; }
  .groupe-date-contenu.ouvert { display: block; }
  .titre-date .fleche-date { transition: transform 0.15s ease; }
  .titre-date.ouvert .fleche-date { transform: rotate(180deg); }

  .btn-supprimer-depart { background-color: transparent; border: 1px solid var(--alerte); color: var(--alerte); margin-top: 8px; padding: 8px; border-radius: var(--rayon-petit); font-size: 12px; font-weight: 600; width: 100%; }

  .fenetre-fond { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(10,10,25,0.75); z-index: 20; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(2px); }
  .fenetre-fond.visible { display: flex; }
  .fenetre-contenu { background-color: var(--surface); border: 1px solid var(--bordure); border-radius: var(--rayon); padding: var(--espace-lg); max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: var(--ombre-carte); }
  .fenetre-contenu p { color: var(--texte-doux); font-size: 14px; margin-top: 6px; }
  .btn-fermer-fenetre { background-color: transparent; border: 1px solid var(--bordure); color: var(--texte); margin-top: var(--espace-md); width: 100%; padding: 12px; border-radius: var(--rayon-petit); font-weight: 600; font-family: var(--police-texte); }
</style>
</head>
<body>

<header class="aw-header">
  <h1>Mon Espace Chauffeur</h1>
  <button class="deconnexion" id="btnDeconnexion">Deconnexion</button>
</header>

<div class="aw-conteneur">
  <div id="zoneContenu" class="chargement">Chargement...</div>
</div>

<div class="fenetre-fond" id="fenetreFond">
  <div class="fenetre-contenu">
    <p class="aw-section-titre">Details de la reservation</p>
    <div id="fenetreDetails"></div>
    <button type="button" class="btn-fermer-fenetre" id="btnFermerFenetre">Fermer</button>
  </div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

var chauffeurCourant = null;

var MOIS_FR = ["Janvier","Fevrier","Mars","Avril","Mai","Juin","Juillet","Aout","Septembre","Octobre","Novembre","Decembre"];
function formatDateFr(dateStr) {
  if (!dateStr) return "";
  var parts = dateStr.split("-");
  if (parts.length !== 3) return dateStr;
  var jour = parseInt(parts[2], 10);
  var mois = MOIS_FR[parseInt(parts[1], 10) - 1];
  return jour + " " + mois + " " + parts[0];
}

document.getElementById("btnDeconnexion").addEventListener("click", function() {
  sb.auth.signOut().then(function() {
    window.location.href = "chauffeur-connexion.html";
  });
});

function chargerEspace() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "chauffeur-connexion.html";
      return;
    }
    sb.from("chauffeurs").select("*").eq("user_id", user.id).single().then(function(reponse) {
      var chauffeur = reponse.data;
      var zone = document.getElementById("zoneContenu");
      if (reponse.error || !chauffeur) {
        zone.innerHTML = "<div class=\"aw-carte\"><p>Profil introuvable. Contactez AW SERVICES.</p></div>";
        return;
      }
      chauffeurCourant = chauffeur;
      var statutLabel = chauffeur.statut === "approuve" ? "Approuve" : "En attente de validation";
      var classeStatut = chauffeur.statut === "approuve" ? "aw-badge-succes" : "aw-badge-attente";

      zone.innerHTML =
        "<div class=\"aw-carte\">" +
          "<p class=\"aw-section-titre\">Bienvenue, " + chauffeur.nom + "</p>" +
          "<span class=\"aw-badge " + classeStatut + "\">" + statutLabel + "</span>" +
          "<p style=\"margin-top:10px;\">Telephone : " + chauffeur.telephone + "</p>" +
          "<p>" + chauffeur.vehicule + "</p>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Point de rassemblement (Dakar &#8594; Bokidiawe)</p>" +
          "<p>Les clients qui prennent ce trajet verront ce point comme lieu de depart, sans avoir a partager leur position.</p>" +
          "<label class=\"aw-label\">Description du lieu</label>" +
          "<textarea class=\"aw-textarea\" id=\"lieuRassemblement\" rows=\"2\" placeholder=\"Ex : Gare routiere de Baux Maraichers, devant le hangar 3\">" + (chauffeur.lieu_rassemblement || "") + "</textarea>" +
          "<button type=\"button\" class=\"aw-btn aw-btn-secondaire\" id=\"btnPositionRassemblement\" style=\"width:100%;margin-top:10px;\">&#128205; Utiliser ma position actuelle (optionnel)</button>" +
          "<p class=\"msg-zone\" id=\"msgPosition\"></p>" +
          "<button type=\"button\" class=\"aw-btn aw-btn-primaire\" id=\"btnEnregistrerRassemblement\" style=\"width:100%;margin-top:10px;\">Enregistrer le point de rassemblement</button>" +
          "<p class=\"msg-zone\" id=\"msgRassemblement\"></p>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Departs programmes</p>" +
          "<p>Les clients ne pourront reserver que sur ces dates/heures precises.</p>" +
          "<label class=\"aw-label\">Trajet</label>" +
          "<div class=\"direction-choix\">" +
            "<button type=\"button\" class=\"btn-direction actif\" id=\"btnDirAller\" data-direction=\"aller\">Dakar &#8594; Bokidiawe</button>" +
            "<button type=\"button\" class=\"btn-direction\" id=\"btnDirRetour\" data-direction=\"retour\">Bokidiawe &#8594; Dakar</button>" +
          "</div>" +
          "<label class=\"aw-label\">Date</label>" +
          "<input class=\"aw-input\" type=\"date\" id=\"nouvelleDate\">" +
          "<label class=\"aw-label\">Heure</label>" +
          "<input class=\"aw-input\" type=\"time\" id=\"nouvelleHeure\">" +
          "<button type=\"button\" class=\"aw-btn aw-btn-primaire\" id=\"btnAjouterDepart\" style=\"width:100%;margin-top:10px;\">Ajouter ce depart</button>" +
          "<p class=\"msg-zone\" id=\"msgDepart\"></p>" +
          "<div id=\"listeDeparts\" style=\"margin-top:12px;\"><p>Chargement...</p></div>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Aller - Dakar &#8594; Bokidiawe</p>" +
          "<p>Passagers qui rejoignent le point de rassemblement.</p>" +
          "<div id=\"listeAller\" style=\"margin-top:10px;\"><p>Chargement...</p></div>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Retour - Bokidiawe &#8594; Dakar</p>" +
          "<p>Tournee a domicile : chaque client doit etre recupere a sa position.</p>" +
          "<div id=\"listeRetour\" style=\"margin-top:10px;\"><p>Chargement...</p></div>" +
        "</div>";

      document.getElementById("btnPositionRassemblement").addEventListener("click", capturerPositionRassemblement);
      document.getElementById("btnEnregistrerRassemblement").addEventListener("click", enregistrerRassemblement);
      document.getElementById("btnAjouterDepart").addEventListener("click", ajouterDepart);
      document.getElementById("btnDirAller").addEventListener("click", function() {
        directionDepart = "aller";
        document.getElementById("btnDirAller").classList.add("actif");
        document.getElementById("btnDirRetour").classList.remove("actif");
        chargerDeparts();
      });
      document.getElementById("btnDirRetour").addEventListener("click", function() {
        directionDepart = "retour";
        document.getElementById("btnDirRetour").classList.add("actif");
        document.getElementById("btnDirAller").classList.remove("actif");
        chargerDeparts();
      });
      chargerDeparts();
      chargerReservations();
      setInterval(chargerDeparts, 20000);
      setInterval(chargerReservations, 20000);
    });
  });
}

var directionDepart = "aller";

var nouvellePosition = null;

function capturerPositionRassemblement() {
  var msg = document.getElementById("msgPosition");
  var btn = document.getElementById("btnPositionRassemblement");

  if (!navigator.geolocation) {
    msg.textContent = "Localisation non disponible sur cet appareil.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Localisation en cours...";

  navigator.geolocation.getCurrentPosition(function(position) {
    nouvellePosition = { lat: position.coords.latitude, lng: position.coords.longitude };
    btn.disabled = false;
    btn.textContent = "Position capturee";
    msg.className = "msg-zone ok";
    msg.textContent = "Position prete, n'oubliez pas d'enregistrer.";
  }, function() {
    btn.disabled = false;
    btn.textContent = "Utiliser ma position actuelle (optionnel)";
    msg.textContent = "Impossible d'obtenir votre position.";
  });
}

function enregistrerRassemblement() {
  var btn = document.getElementById("btnEnregistrerRassemblement");
  var msg = document.getElementById("msgRassemblement");
  var texte = document.getElementById("lieuRassemblement").value;

  if (!texte) {
    msg.className = "msg-zone err";
    msg.textContent = "Decrivez le lieu de rassemblement.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Enregistrement...";

  var maj = { lieu_rassemblement: texte };
  if (nouvellePosition) {
    maj.latitude = nouvellePosition.lat;
    maj.longitude = nouvellePosition.lng;
  }

  sb.from("chauffeurs").update(maj).eq("id", chauffeurCourant.id).then(function(reponse) {
    btn.disabled = false;
    btn.textContent = "Enregistrer le point de rassemblement";
    if (reponse.error) {
      msg.className = "msg-zone err";
      msg.textContent = "Erreur : " + reponse.error.message;
      return;
    }
    msg.className = "msg-zone ok";
    msg.textContent = "Point de rassemblement enregistre.";
  });
}

function ajouterDepart() {
  var btn = document.getElementById("btnAjouterDepart");
  var msg = document.getElementById("msgDepart");
  var date = document.getElementById("nouvelleDate").value;
  var heure = document.getElementById("nouvelleHeure").value;

  if (!date || !heure) {
    msg.className = "msg-zone err";
    msg.textContent = "Choisissez une date et une heure.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Ajout en cours...";

  sb.from("departs_programmes").insert([{
    date_depart: date,
    heure_depart: heure,
    direction: directionDepart,
    chauffeur_id: chauffeurCourant.id,
    statut: "actif"
  }]).then(function(reponse) {
    btn.disabled = false;
    btn.textContent = "Ajouter ce depart";
    if (reponse.error) {
      msg.className = "msg-zone err";
      msg.textContent = "Erreur : " + reponse.error.message;
      return;
    }
    msg.className = "msg-zone ok";
    msg.textContent = "Depart ajoute.";
    document.getElementById("nouvelleDate").value = "";
    document.getElementById("nouvelleHeure").value = "";
    chargerDeparts();
  });
}

function chargerDeparts() {
  var aujourdHui = new Date().toISOString().split("T")[0];
  sb.from("departs_programmes").select("*").eq("chauffeur_id", chauffeurCourant.id).eq("statut", "actif").eq("direction", directionDepart).gte("date_depart", aujourdHui).order("date_depart", { ascending: true }).then(function(reponse) {
    var data = reponse.data || [];
    var zone = document.getElementById("listeDeparts");
    if (data.length === 0) {
      zone.innerHTML = "<p>Aucun depart programme.</p>";
      return;
    }
    var html = "<div class=\"grille-reservations\">";
    for (var i = 0; i < data.length; i++) {
      var d = data[i];
      html += "<div class=\"reservation-carte\" style=\"cursor:default;\">" +
                "<div style=\"font-size:14px;\">" + formatDateFr(d.date_depart) + "</div>" +
                "<div style=\"font-size:12px;color:var(--texte-doux);font-weight:400;margin-top:2px;\">" + d.heure_depart + "</div>" +
                "<button type=\"button\" class=\"btn-supprimer-depart\" data-id=\"" + d.id + "\">Supprimer</button>" +
              "</div>";
    }
    html += "</div>";
    zone.innerHTML = html;

    var boutons = zone.getElementsByClassName("btn-supprimer-depart");
    for (var b = 0; b < boutons.length; b++) {
      boutons[b].addEventListener("click", function(e) {
        e.stopPropagation();
        supprimerDepart(e.target.getAttribute("data-id"));
      });
    }
  });
}

function supprimerDepart(id) {
  sb.from("departs_programmes").update({ statut: "annule" }).eq("id", id).then(function() {
    chargerDeparts();
  });
}

function chargerReservations() {
  var aujourdHui = new Date().toISOString().split("T")[0];
  sb.from("reservations_voiture").select("*").gte("date_voyage", aujourdHui).eq("statut_paiement", "paye").neq("statut", "annulee").order("date_voyage", { ascending: true }).then(function(reponse) {
    var data = reponse.data || [];
    var aller = data.filter(function(r) { return r.direction === "aller"; });
    var retour = data.filter(function(r) { return r.direction === "retour"; });
    afficherAller(aller);
    afficherRetour(retour);
  });
}

var reservationsIndex = {};

document.getElementById("btnFermerFenetre").addEventListener("click", function() {
  document.getElementById("fenetreFond").classList.remove("visible");
});
document.getElementById("fenetreFond").addEventListener("click", function(e) {
  if (e.target.id === "fenetreFond") {
    document.getElementById("fenetreFond").classList.remove("visible");
  }
});

function ouvrirFenetre(id) {
  var r = reservationsIndex[id];
  if (!r) return;
  var html = "<p>Nom : " + (r.prenom || "") + " " + (r.nom_famille || r.client_nom) + "</p>" +
             "<p>Date : " + formatDateFr(r.date_voyage) + "</p>";
  if (r.cni_passeport) html += "<p>CNI/Passeport : " + r.cni_passeport + "</p>";
  if (r.direction === "retour" && r.village_depart) html += "<p>Village de depart : " + r.village_depart + "</p>";
  html += "<p>Telephone : " + r.client_telephone + "</p>";
  html += "<p>Paiement : " + r.mode_paiement + "</p>";
  if (r.prix_total) html += "<p style=\"font-family:var(--police-chiffres);color:var(--accent);font-weight:700;\">Prix : " + Number(r.prix_total).toLocaleString("fr-FR") + " FCFA</p>";
  if (r.direction === "retour") {
    if (r.latitude && r.longitude) {
      html += "<a class=\"btn-maps\" href=\"https://www.google.com/maps/dir/?api=1&destination=" + r.latitude + "," + r.longitude + "\" target=\"_blank\">Itineraire vers le client</a>";
    } else {
      html += "<p style=\"color:var(--accent);\">Position non fournie par le client.</p>";
    }
  }
  document.getElementById("fenetreDetails").innerHTML = html;
  document.getElementById("fenetreFond").classList.add("visible");
}

function grouperParDate(liste) {
  var groupes = {};
  var dates = [];
  for (var i = 0; i < liste.length; i++) {
    var d = liste[i].date_voyage;
    if (!groupes[d]) {
      groupes[d] = [];
      dates.push(d);
    }
    groupes[d].push(liste[i]);
  }
  dates.sort();
  return { groupes: groupes, dates: dates };
}

function basculerAccordeon(idTitre, idContenu) {
  document.getElementById(idTitre).classList.toggle("ouvert");
  document.getElementById(idContenu).classList.toggle("ouvert");
}

function afficherAller(liste) {
  var zone = document.getElementById("listeAller");
  if (liste.length === 0) {
    zone.innerHTML = "<p>Aucune reservation pour le moment.</p>";
    return;
  }
  var g = grouperParDate(liste);
  var html = "";
  for (var d = 0; d < g.dates.length; d++) {
    var date = g.dates[d];
    var idGroupe = "grpAller" + d;
    var ouvertClasse = d === 0 ? " ouvert" : "";
    html += "<p class=\"titre-date" + ouvertClasse + "\" data-cible=\"" + idGroupe + "\">Depart du " + formatDateFr(date) + " <span class=\"fleche-date\">&#9662;</span></p>";
    html += "<div class=\"grille-reservations groupe-date-contenu" + ouvertClasse + "\" id=\"" + idGroupe + "\">";
    var groupe = g.groupes[date];
    for (var i = 0; i < groupe.length; i++) {
      var r = groupe[i];
      reservationsIndex[r.id] = r;
      html += "<div class=\"reservation-carte\" data-id=\"" + r.id + "\">Chaise " + r.siege + "</div>";
    }
    html += "</div>";
  }
  zone.innerHTML = html;
  attacherClicsCartes(zone);
  attacherClicsDates(zone);
}

function afficherRetour(liste) {
  var zone = document.getElementById("listeRetour");
  if (liste.length === 0) {
    zone.innerHTML = "<p>Aucune reservation pour le moment.</p>";
    return;
  }
  var g = grouperParDate(liste);
  var html = "";
  for (var d = 0; d < g.dates.length; d++) {
    var date = g.dates[d];
    var idGroupe = "grpRetour" + d;
    var ouvertClasse = d === 0 ? " ouvert" : "";
    html += "<p class=\"titre-date" + ouvertClasse + "\" data-cible=\"" + idGroupe + "\">Depart du " + formatDateFr(date) + " <span class=\"fleche-date\">&#9662;</span></p>";
    html += "<div class=\"grille-reservations groupe-date-contenu" + ouvertClasse + "\" id=\"" + idGroupe + "\">";
    var groupe = g.groupes[date];
    for (var i = 0; i < groupe.length; i++) {
      var r = groupe[i];
      reservationsIndex[r.id] = r;
      html += "<div class=\"reservation-carte\" data-id=\"" + r.id + "\">Chaise " + r.siege + "</div>";
    }
    html += "</div>";
  }
  zone.innerHTML = html;
  attacherClicsCartes(zone);
  attacherClicsDates(zone);
}

function attacherClicsDates(zone) {
  var titres = zone.getElementsByClassName("titre-date");
  for (var i = 0; i < titres.length; i++) {
    titres[i].addEventListener("click", function() {
      this.classList.toggle("ouvert");
      document.getElementById(this.getAttribute("data-cible")).classList.toggle("ouvert");
    });
  }
}

function attacherClicsCartes(zone) {
  var cartes = zone.getElementsByClassName("reservation-carte");
  for (var i = 0; i < cartes.length; i++) {
    cartes[i].addEventListener("click", function(e) {
      ouvrirFenetre(this.getAttribute("data-id"));
    });
  }
}

chargerEspace();
</script>

</body>
</html>
