<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Mon Espace Chauffeur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background-color: #0a0e17; color: #ffffff; }
  header { background-color: #0d1220; padding: 20px; text-align: center; border-bottom: 2px solid #d62828; display: flex; justify-content: space-between; align-items: center; }
  header h1 { color: #1e6fd9; font-size: 18px; }
  .deconnexion { background-color: transparent; border: 1px solid #d62828; color: #d62828; padding: 8px 14px; border-radius: 6px; font-size: 13px; }
  .content { padding: 20px 15px; max-width: 500px; margin: 0 auto; }
  .carte { background-color: #121826; border: 1px solid #1e6fd9; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
  .carte h2 { font-size: 16px; margin-bottom: 10px; }
  .statut { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
  .statut.en_attente { background-color: #3a2e14; color: #ffb84d; }
  .statut.approuve { background-color: #143a1e; color: #80ff9e; }
  .info { color: #b0b8c5; font-size: 14px; margin-top: 6px; }
  .chargement { text-align: center; padding: 40px; color: #b0b8c5; }
  label { font-size: 14px; color: #b0b8c5; display: block; margin-top: 10px; margin-bottom: 6px; }
  input, textarea { width: 100%; background-color: #0a0e17; border: 1px solid #2a3040; border-radius: 6px; padding: 10px; color: #ffffff; font-size: 14px; }
  button { background-color: #1e6fd9; color: #ffffff; border: none; border-radius: 6px; padding: 12px; font-size: 14px; font-weight: bold; margin-top: 10px; width: 100%; }
  button:disabled { opacity: 0.6; }
  .btn-position { background-color: transparent; border: 1px solid #1e6fd9; color: #1e6fd9; }
  .msg-zone { font-size: 13px; margin-top: 8px; }
  .msg-zone.ok { color: #80ff9e; }
  .msg-zone.err { color: #ff8080; }
  .reservation-carte { background-color: #0a0e17; border: 1px solid #2a3040; border-radius: 8px; padding: 12px; cursor: pointer; }
  .reservation-carte h3 { font-size: 14px; }
  .reservation-carte p { font-size: 13px; color: #b0b8c5; margin-top: 3px; }
  .grille-reservations { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .details-reservation { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a3040; }
  .reservation-carte.ouvert .details-reservation { display: block; }
  .btn-maps { display: inline-block; background-color: #1e6fd9; color: #ffffff; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-top: 8px; }
  .direction-choix { display: flex; gap: 8px; margin-top: 8px; margin-bottom: 8px; }
  .btn-direction { flex: 1; background-color: #0a0e17; border: 1px solid #2a3040; color: #b0b8c5; padding: 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 0; }
  .btn-direction.actif { background-color: #1e6fd9; border-color: #1e6fd9; color: #ffffff; }
  .fenetre-fond { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.7); z-index: 20; align-items: center; justify-content: center; padding: 20px; }
  .fenetre-fond.visible { display: flex; }
  .fenetre-contenu { background-color: #121826; border: 1px solid #1e6fd9; border-radius: 10px; padding: 20px; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .fenetre-contenu h3 { font-size: 16px; margin-bottom: 12px; }
  .fenetre-contenu p { font-size: 14px; color: #b0b8c5; margin-top: 6px; }
  .btn-fermer-fenetre { background-color: transparent; border: 1px solid #d62828; color: #d62828; margin-top: 15px; }
</style>
</head>
<body>

<header>
  <h1>Mon Espace Chauffeur</h1>
  <button class="deconnexion" id="btnDeconnexion">Deconnexion</button>
</header>

<div class="content">
  <div id="zoneContenu" class="chargement">Chargement...</div>
</div>

<div class="fenetre-fond" id="fenetreFond">
  <div class="fenetre-contenu">
    <h3>Details de la reservation</h3>
    <div id="fenetreDetails"></div>
    <button type="button" class="btn-fermer-fenetre" id="btnFermerFenetre">Fermer</button>
  </div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

var chauffeurCourant = null;

document.getElementById("btnDeconnexion").addEventListener("click", function() {
  sb.auth.signOut().then(function() {
    window.location.href = "chauffeur-connexion.html";
  });
});

function chargerEspace() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "chauffeur-connexion.html";
      return;
    }
    sb.from("chauffeurs").select("*").eq("user_id", user.id).single().then(function(reponse) {
      var chauffeur = reponse.data;
      var zone = document.getElementById("zoneContenu");
      if (reponse.error || !chauffeur) {
        zone.innerHTML = "<div class=\"carte\"><p class=\"info\">Profil introuvable. Contactez AW SERVICES.</p></div>";
        return;
      }
      chauffeurCourant = chauffeur;
      var statutLabel = chauffeur.statut === "approuve" ? "Approuve" : "En attente de validation";

      zone.innerHTML =
        "<div class=\"carte\">" +
          "<h2>Bienvenue, " + chauffeur.nom + "</h2>" +
          "<span class=\"statut " + chauffeur.statut + "\">" + statutLabel + "</span>" +
          "<p class=\"info\">Telephone : " + chauffeur.telephone + "</p>" +
          "<p class=\"info\">" + chauffeur.vehicule + "</p>" +
        "</div>" +
        "<div class=\"carte\">" +
          "<h2>Point de rassemblement (Dakar &#8594; Bokidiawe)</h2>" +
          "<p class=\"info\">Les clients qui prennent ce trajet verront ce point comme lieu de depart, sans avoir a partager leur position.</p>" +
          "<label>Description du lieu</label>" +
          "<textarea id=\"lieuRassemblement\" rows=\"2\" placeholder=\"Ex : Gare routiere de Baux Maraichers, devant le hangar 3\">" + (chauffeur.lieu_rassemblement || "") + "</textarea>" +
          "<button type=\"button\" class=\"btn-position\" id=\"btnPositionRassemblement\">Utiliser ma position actuelle (optionnel)</button>" +
          "<p class=\"msg-zone\" id=\"msgPosition\"></p>" +
          "<button type=\"button\" id=\"btnEnregistrerRassemblement\">Enregistrer le point de rassemblement</button>" +
          "<p class=\"msg-zone\" id=\"msgRassemblement\"></p>" +
        "</div>" +
        "<div class=\"carte\">" +
          "<h2>Departs programmes</h2>" +
          "<p class=\"info\">Les clients ne pourront reserver que sur ces dates/heures precises.</p>" +
          "<label>Trajet</label>" +
          "<div class=\"direction-choix\">" +
            "<button type=\"button\" class=\"btn-direction actif\" id=\"btnDirAller\" data-direction=\"aller\">Dakar &#8594; Bokidiawe</button>" +
            "<button type=\"button\" class=\"btn-direction\" id=\"btnDirRetour\" data-direction=\"retour\">Bokidiawe &#8594; Dakar</button>" +
          "</div>" +
          "<label>Date</label>" +
          "<input type=\"date\" id=\"nouvelleDate\">" +
          "<label>Heure</label>" +
          "<input type=\"time\" id=\"nouvelleHeure\">" +
          "<button type=\"button\" id=\"btnAjouterDepart\">Ajouter ce depart</button>" +
          "<p class=\"msg-zone\" id=\"msgDepart\"></p>" +
          "<div id=\"listeDeparts\" style=\"margin-top:12px;\"><p class=\"info\">Chargement...</p></div>" +
        "</div>" +
        "<div class=\"carte\">" +
          "<h2>Aller - Dakar &#8594; Bokidiawe</h2>" +
          "<p class=\"info\">Passagers qui rejoignent le point de rassemblement.</p>" +
          "<div id=\"listeAller\"><p class=\"info\">Chargement...</p></div>" +
        "</div>" +
        "<div class=\"carte\">" +
          "<h2>Retour - Bokidiawe &#8594; Dakar</h2>" +
          "<p class=\"info\">Tournee a domicile : chaque client doit etre recupere a sa position.</p>" +
          "<div id=\"listeRetour\"><p class=\"info\">Chargement...</p></div>" +
        "</div>";

      document.getElementById("btnPositionRassemblement").addEventListener("click", capturerPositionRassemblement);
      document.getElementById("btnEnregistrerRassemblement").addEventListener("click", enregistrerRassemblement);
      document.getElementById("btnAjouterDepart").addEventListener("click", ajouterDepart);
      document.getElementById("btnDirAller").addEventListener("click", function() {
        directionDepart = "aller";
        document.getElementById("btnDirAller").classList.add("actif");
        document.getElementById("btnDirRetour").classList.remove("actif");
        chargerDeparts();
      });
      document.getElementById("btnDirRetour").addEventListener("click", function() {
        directionDepart = "retour";
        document.getElementById("btnDirRetour").classList.add("actif");
        document.getElementById("btnDirAller").classList.remove("actif");
        chargerDeparts();
      });
      chargerDeparts();
      chargerReservations();
    });
  });
}

var directionDepart = "aller";

var nouvellePosition = null;

function capturerPositionRassemblement() {
  var msg = document.getElementById("msgPosition");
  var btn = document.getElementById("btnPositionRassemblement");

  if (!navigator.geolocation) {
    msg.textContent = "Localisation non disponible sur cet appareil.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Localisation en cours...";

  navigator.geolocation.getCurrentPosition(function(position) {
    nouvellePosition = { lat: position.coords.latitude, lng: position.coords.longitude };
    btn.disabled = false;
    btn.textContent = "Position capturee";
    msg.className = "msg-zone ok";
    msg.textContent = "Position prete, n'oubliez pas d'enregistrer.";
  }, function() {
    btn.disabled = false;
    btn.textContent = "Utiliser ma position actuelle (optionnel)";
    msg.textContent = "Impossible d'obtenir votre position.";
  });
}

function enregistrerRassemblement() {
  var btn = document.getElementById("btnEnregistrerRassemblement");
  var msg = document.getElementById("msgRassemblement");
  var texte = document.getElementById("lieuRassemblement").value;

  if (!texte) {
    msg.className = "msg-zone err";
    msg.textContent = "Decrivez le lieu de rassemblement.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Enregistrement...";

  var maj = { lieu_rassemblement: texte };
  if (nouvellePosition) {
    maj.latitude = nouvellePosition.lat;
    maj.longitude = nouvellePosition.lng;
  }

  sb.from("chauffeurs").update(maj).eq("id", chauffeurCourant.id).then(function(reponse) {
    btn.disabled = false;
    btn.textContent = "Enregistrer le point de rassemblement";
    if (reponse.error) {
      msg.className = "msg-zone err";
      msg.textContent = "Erreur : " + reponse.error.message;
      return;
    }
    msg.className = "msg-zone ok";
    msg.textContent = "Point de rassemblement enregistre.";
  });
}

function ajouterDepart() {
  var btn = document.getElementById("btnAjouterDepart");
  var msg = document.getElementById("msgDepart");
  var date = document.getElementById("nouvelleDate").value;
  var heure = document.getElementById("nouvelleHeure").value;

  if (!date || !heure) {
    msg.className = "msg-zone err";
    msg.textContent = "Choisissez une date et une heure.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Ajout en cours...";

  sb.from("departs_programmes").insert([{
    date_depart: date,
    heure_depart: heure,
    direction: directionDepart,
    chauffeur_id: chauffeurCourant.id,
    statut: "actif"
  }]).then(function(reponse) {
    btn.disabled = false;
    btn.textContent = "Ajouter ce depart";
    if (reponse.error) {
      msg.className = "msg-zone err";
      msg.textContent = "Erreur : " + reponse.error.message;
      return;
    }
    msg.className = "msg-zone ok";
    msg.textContent = "Depart ajoute.";
    document.getElementById("nouvelleDate").value = "";
    document.getElementById("nouvelleHeure").value = "";
    chargerDeparts();
  });
}

function chargerDeparts() {
  var aujourdHui = new Date().toISOString().split("T")[0];
  sb.from("departs_programmes").select("*").eq("chauffeur_id", chauffeurCourant.id).eq("statut", "actif").eq("direction", directionDepart).gte("date_depart", aujourdHui).order("date_depart", { ascending: true }).then(function(reponse) {
    var data = reponse.data || [];
    var zone = document.getElementById("listeDeparts");
    if (data.length === 0) {
      zone.innerHTML = "<p class=\"info\">Aucun depart programme.</p>";
      return;
    }
    var html = "<div class=\"grille-reservations\">";
    for (var i = 0; i < data.length; i++) {
      var d = data[i];
      html += "<div class=\"reservation-carte\">" +
                "<h3>" + d.date_depart + "</h3>" +
                "<p>" + d.heure_depart + "</p>" +
                "<button type=\"button\" class=\"btn-supprimer-depart\" data-id=\"" + d.id + "\" style=\"background-color:transparent;border:1px solid #d62828;color:#d62828;margin-top:8px;\">Supprimer</button>" +
              "</div>";
    }
    html += "</div>";
    zone.innerHTML = html;

    var boutons = zone.getElementsByClassName("btn-supprimer-depart");
    for (var b = 0; b < boutons.length; b++) {
      boutons[b].addEventListener("click", function(e) {
        e.stopPropagation();
        supprimerDepart(e.target.getAttribute("data-id"));
      });
    }
  });
}

function supprimerDepart(id) {
  sb.from("departs_programmes").update({ statut: "annule" }).eq("id", id).then(function() {
    chargerDeparts();
  });
}

function chargerReservations() {
  var aujourdHui = new Date().toISOString().split("T")[0];
  sb.from("reservations_voiture").select("*").gte("date_voyage", aujourdHui).neq("statut", "annulee").order("date_voyage", { ascending: true }).then(function(reponse) {
    var data = reponse.data || [];
    var aller = data.filter(function(r) { return r.direction === "aller"; });
    var retour = data.filter(function(r) { return r.direction === "retour"; });
    afficherAller(aller);
    afficherRetour(retour);
  });
}

var reservationsIndex = {};

document.getElementById("btnFermerFenetre").addEventListener("click", function() {
  document.getElementById("fenetreFond").classList.remove("visible");
});
document.getElementById("fenetreFond").addEventListener("click", function(e) {
  if (e.target.id === "fenetreFond") {
    document.getElementById("fenetreFond").classList.remove("visible");
  }
});

function ouvrirFenetre(id) {
  var r = reservationsIndex[id];
  if (!r) return;
  var html = "<p>Nom : " + (r.prenom || "") + " " + (r.nom_famille || r.client_nom) + "</p>" +
             "<p>Date : " + r.date_voyage + "</p>";
  if (r.cni_passeport) html += "<p>CNI/Passeport : " + r.cni_passeport + "</p>";
  if (r.direction === "retour" && r.village_depart) html += "<p>Village de depart : " + r.village_depart + "</p>";
  html += "<p>Telephone : " + r.client_telephone + "</p>";
  html += "<p>Paiement : " + r.mode_paiement + "</p>";
  if (r.prix_total) html += "<p>Prix : " + Number(r.prix_total).toLocaleString("fr-FR") + " FCFA</p>";
  if (r.direction === "retour") {
    if (r.latitude && r.longitude) {
      html += "<a class=\"btn-maps\" href=\"https://www.google.com/maps/dir/?api=1&destination=" + r.latitude + "," + r.longitude + "\" target=\"_blank\">Itineraire vers le client</a>";
    } else {
      html += "<p style=\"color:#ffb84d;\">Position non fournie par le client.</p>";
    }
  }
  document.getElementById("fenetreDetails").innerHTML = html;
  document.getElementById("fenetreFond").classList.add("visible");
}

function grouperParDate(liste) {
  var groupes = {};
  var dates = [];
  for (var i = 0; i < liste.length; i++) {
    var d = liste[i].date_voyage;
    if (!groupes[d]) {
      groupes[d] = [];
      dates.push(d);
    }
    groupes[d].push(liste[i]);
  }
  dates.sort();
  return { groupes: groupes, dates: dates };
}

function afficherAller(liste) {
  var zone = document.getElementById("listeAller");
  if (liste.length === 0) {
    zone.innerHTML = "<p class=\"info\">Aucune reservation pour le moment.</p>";
    return;
  }
  var g = grouperParDate(liste);
  var html = "";
  for (var d = 0; d < g.dates.length; d++) {
    var date = g.dates[d];
    html += "<p style=\"color:#1e6fd9;font-size:13px;font-weight:bold;margin-top:14px;margin-bottom:8px;\">Depart du " + date + "</p>";
    html += "<div class=\"grille-reservations\">";
    var groupe = g.groupes[date];
    for (var i = 0; i < groupe.length; i++) {
      var r = groupe[i];
      reservationsIndex[r.id] = r;
      html += "<div class=\"reservation-carte\" data-id=\"" + r.id + "\">" +
                "<h3>Chaise " + r.siege + "</h3>" +
              "</div>";
    }
    html += "</div>";
  }
  zone.innerHTML = html;
  attacherClicsCartes(zone);
}

function afficherRetour(liste) {
  var zone = document.getElementById("listeRetour");
  if (liste.length === 0) {
    zone.innerHTML = "<p class=\"info\">Aucune reservation pour le moment.</p>";
    return;
  }
  var g = grouperParDate(liste);
  var html = "";
  for (var d = 0; d < g.dates.length; d++) {
    var date = g.dates[d];
    html += "<p style=\"color:#1e6fd9;font-size:13px;font-weight:bold;margin-top:14px;margin-bottom:8px;\">Depart du " + date + "</p>";
    html += "<div class=\"grille-reservations\">";
    var groupe = g.groupes[date];
    for (var i = 0; i < groupe.length; i++) {
      var r = groupe[i];
      reservationsIndex[r.id] = r;
      html += "<div class=\"reservation-carte\" data-id=\"" + r.id + "\">" +
                "<h3>Chaise " + r.siege + "</h3>" +
              "</div>";
    }
    html += "</div>";
  }
  zone.innerHTML = html;
  attacherClicsCartes(zone);
}

function attacherClicsCartes(zone) {
  var cartes = zone.getElementsByClassName("reservation-carte");
  for (var i = 0; i < cartes.length; i++) {
    cartes[i].addEventListener("click", function(e) {
      ouvrirFenetre(this.getAttribute("data-id"));
    });
  }
}

chargerEspace();
</script>

</body>
</html>
