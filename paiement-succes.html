<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Paiement</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .zone-confirmation { max-width: 480px; margin: 40px auto; text-align: center; padding: 0 var(--espace-md); }
  .icone-succes { font-size: 56px; margin-bottom: 10px; }

  .billet {
    background-color: var(--surface);
    border: 1px solid var(--bordure);
    border-radius: var(--rayon);
    padding: var(--espace-lg);
    text-align: left;
    margin-top: var(--espace-lg);
    box-shadow: var(--ombre-carte);
  }
  .billet-entete { text-align: center; border-bottom: 1px dashed var(--bordure); padding-bottom: 12px; margin-bottom: 12px; }
  .billet-entete .marque { color: var(--accent); font-family: var(--police-titre); font-weight: 700; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; }
  .billet-entete .trajet { font-size: 19px; font-weight: 700; margin-top: 4px; }
  .billet-ligne { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; border-bottom: 1px solid var(--bordure); }
  .billet-ligne:last-of-type { border-bottom: none; }
  .billet-ligne .label { color: var(--texte-doux); }
  .billet-ligne .valeur { color: var(--texte); font-weight: 600; text-align: right; }
  .billet-siege { text-align: center; margin: 14px 0; }
  .billet-siege .num { font-family: var(--police-chiffres); font-size: 40px; font-weight: 700; color: var(--accent); }
  .billet-siege .txt { font-size: 11px; color: var(--texte-doux); text-transform: uppercase; letter-spacing: 0.05em; }
  .billet-qr { text-align: center; margin-top: 14px; }
  .billet-qr img { border-radius: var(--rayon-petit); background-color: #fff; padding: 8px; }
  .billet-ref { text-align: center; font-family: var(--police-chiffres); font-size: 13px; color: var(--texte-discret); margin-top: 8px; letter-spacing: 0.05em; }
  .billet-note { text-align: center; color: var(--accent); font-size: 12.5px; margin-top: 14px; }

  .spinner { width: 34px; height: 34px; border: 3px solid var(--bordure); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: tourner 0.8s linear infinite; }
  @keyframes tourner { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="zone-confirmation">
  <div id="zoneIcone" class="icone-succes">
    <div class="spinner"></div>
  </div>
  <h1 id="titreMessage" style="color:var(--accent);font-family:var(--police-titre);">Verification du paiement...</h1>
  <p id="texteMessage" style="color:var(--texte-doux);margin-top:10px;">
    Merci de patienter quelques secondes.
  </p>

  <div id="zoneBillet"></div>

  <a href="index.html" class="aw-btn aw-btn-primaire" style="display:inline-block;margin-top:24px;">Retour a l'accueil</a>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

var MOIS_FR = ["Janvier","Fevrier","Mars","Avril","Mai","Juin","Juillet","Aout","Septembre","Octobre","Novembre","Decembre"];
function formatDateFr(dateStr) {
  if (!dateStr) return "";
  var parts = dateStr.split("-");
  if (parts.length !== 3) return dateStr;
  var jour = parseInt(parts[2], 10);
  var mois = MOIS_FR[parseInt(parts[1], 10) - 1];
  return jour + " " + mois + " " + parts[0];
}

function afficherBillet(t) {
  var texteTrajet = t.direction === "aller" ? "Dakar \u2192 Bokidiawe" : "Bokidiawe \u2192 Dakar";
  var reference = (t.id || "").replace(/-/g, "").slice(0, 8).toUpperCase();
  var qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=" + encodeURIComponent(t.id || "");

  var html = "<div class=\"billet\">" +
    "<div class=\"billet-entete\">" +
      "<div class=\"marque\">AW SERVICES &mdash; Billet de voyage</div>" +
      "<div class=\"trajet\">" + texteTrajet + "</div>" +
    "</div>" +
    "<div class=\"billet-siege\"><div class=\"num\">Chaise " + t.siege + "</div><div class=\"txt\">Numero de place</div></div>" +
    "<div class=\"billet-ligne\"><span class=\"label\">Passager</span><span class=\"valeur\">" + t.nom + "</span></div>" +
    "<div class=\"billet-ligne\"><span class=\"label\">Date de depart</span><span class=\"valeur\">" + formatDateFr(t.date_voyage) + "</span></div>" +
    "<div class=\"billet-ligne\"><span class=\"label\">Telephone</span><span class=\"valeur\">" + t.telephone + "</span></div>";
  if (t.village) {
    html += "<div class=\"billet-ligne\"><span class=\"label\">Village de depart</span><span class=\"valeur\">" + t.village + "</span></div>";
  }
  if (t.valises) {
    html += "<div class=\"billet-ligne\"><span class=\"label\">Valises supplementaires</span><span class=\"valeur\">" + t.valises + "</span></div>";
  }
  html += "<div class=\"billet-ligne\"><span class=\"label\">Total paye</span><span class=\"valeur\">" + Number(t.prix_total).toLocaleString("fr-FR") + " FCFA</span></div>" +
    "<div class=\"billet-qr\"><img src=\"" + qrUrl + "\" alt=\"QR code du billet\"></div>" +
    "<div class=\"billet-ref\">Reference : " + reference + "</div>" +
  "</div>" +
  "<p class=\"billet-note\">Presentez ce billet (capture d'ecran) au chauffeur le jour du depart.</p>";

  document.getElementById("zoneBillet").innerHTML = html;
}

function etatFinal(succes, titre, message) {
  document.getElementById("zoneIcone").innerHTML = succes ? "&#9989;" : "&#9888;&#65039;";
  document.getElementById("titreMessage").textContent = titre;
  document.getElementById("titreMessage").style.color = succes ? "var(--accent)" : "var(--alerte)";
  document.getElementById("texteMessage").textContent = message;
}

var ticketBrut = localStorage.getItem("aw_dernier_ticket");

if (!ticketBrut) {
  etatFinal(true, "Paiement reussi !", "Votre paiement a bien ete confirme. Votre commande est en cours de traitement, vous recevrez bientot une notification avec les details de la livraison.");
} else {
  var t;
  try {
    t = JSON.parse(ticketBrut);
  } catch (e) {
    t = null;
  }

  if (t && t.type === "commande" && t.paytech_token) {
    var tentativesCommande = 0;

    function verifierCommande() {
      fetch("https://vnceunqygoiwglnwpgcr.supabase.co/functions/v1/paytech-check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: t.paytech_token, table: "commandes", id: t.id })
      }).then(function(r) { return r.json(); }).then(function(resultat) {
        if (resultat.confirme === true) {
          etatFinal(true, "Paiement reussi !", "Votre commande (" + t.produit + " - " + Number(t.total).toLocaleString("fr-FR") + " FCFA) est confirmee et en cours de traitement. Vous recevrez bientot une notification avec les details de la livraison.");
          localStorage.removeItem("aw_dernier_ticket");
        } else if (tentativesCommande < 4) {
          tentativesCommande++;
          setTimeout(verifierCommande, 3000);
        } else if (resultat.state === "running") {
          etatFinal(false, "Paiement en cours de traitement", "Votre paiement n'est pas encore confirme. Patientez une minute, votre commande sera automatiquement mise a jour des confirmation.");
        } else {
          etatFinal(false, "Paiement non confirme", "Nous n'avons pas pu confirmer ce paiement pour le moment. Si le montant a ete debite, contactez-nous sur WhatsApp.");
        }
      }).catch(function() {
        if (tentativesCommande < 4) {
          tentativesCommande++;
          setTimeout(verifierCommande, 3000);
        } else {
          etatFinal(false, "Verification impossible", "Nous n'avons pas pu verifier votre paiement pour le moment. Contactez-nous sur WhatsApp si le montant a ete debite.");
        }
      });
    }

    verifierCommande();
  } else if (t && t.type === "recharge_livreur" && t.paytech_token) {
    var tentativesRecharge = 0;

    function verifierRecharge() {
      fetch("https://vnceunqygoiwglnwpgcr.supabase.co/functions/v1/paytech-check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: t.paytech_token, table: "recharges_livreurs", id: t.id })
      }).then(function(r) { return r.json(); }).then(function(resultat) {
        if (resultat.confirme === true) {
          etatFinal(true, "Recharge reussie !", "Votre solde a ete credite de " + Number(t.montant).toLocaleString("fr-FR") + " FCFA. Vous pouvez retourner dans votre espace livreur pour accepter des courses.");
          localStorage.removeItem("aw_dernier_ticket");
        } else if (tentativesRecharge < 4) {
          tentativesRecharge++;
          setTimeout(verifierRecharge, 3000);
        } else if (resultat.state === "running") {
          etatFinal(false, "Paiement en cours de traitement", "Votre recharge n'est pas encore confirmee. Patientez une minute puis retournez dans votre espace livreur pour verifier votre solde.");
        } else {
          etatFinal(false, "Paiement non confirme", "Nous n'avons pas pu confirmer cette recharge pour le moment. Si le montant a ete debite, contactez-nous sur WhatsApp.");
        }
      }).catch(function() {
        if (tentativesRecharge < 4) {
          tentativesRecharge++;
          setTimeout(verifierRecharge, 3000);
        } else {
          etatFinal(false, "Verification impossible", "Nous n'avons pas pu verifier votre recharge pour le moment. Retournez dans votre espace livreur dans quelques minutes pour verifier votre solde.");
        }
      });
    }

    verifierRecharge();
  } else if (!t || t.type !== "reservation_voiture") {
    etatFinal(true, "Paiement reussi !", "Votre paiement a bien ete confirme. Votre commande est en cours de traitement, vous recevrez bientot une notification avec les details de la livraison.");
    localStorage.removeItem("aw_dernier_ticket");
  } else if (!t.paytech_token) {
    // Pas de token disponible, on affiche quand meme le billet (ancien flux)
    etatFinal(true, "Paiement reussi !", "Votre reservation est confirmee. Voici votre billet :");
    afficherBillet(t);
    localStorage.removeItem("aw_dernier_ticket");
  } else {
    var tentatives = 0;

    function verifierPaiement() {
      fetch("https://vnceunqygoiwglnwpgcr.supabase.co/functions/v1/paytech-check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: t.paytech_token, table: "reservations_voiture", id: t.id })
      }).then(function(r) { return r.json(); }).then(function(resultat) {
        if (resultat.confirme === true) {
          etatFinal(true, "Paiement reussi !", "Votre reservation est confirmee. Voici votre billet :");
          afficherBillet(t);
          localStorage.removeItem("aw_dernier_ticket");
        } else if (tentatives < 4) {
          tentatives++;
          setTimeout(verifierPaiement, 3000);
        } else if (resultat.state === "running") {
          etatFinal(false, "Paiement en cours de traitement", "Votre paiement n'est pas encore confirme. Patientez une minute puis retrouvez votre billet via \"Deja reserve ? Retrouver mon billet\" sur la page Transport.");
        } else {
          etatFinal(false, "Paiement non confirme", "Nous n'avons pas pu confirmer ce paiement pour le moment. Si le montant a ete debite, contactez-nous sur WhatsApp avec la reference de votre reservation.");
        }
      }).catch(function() {
        if (tentatives < 4) {
          tentatives++;
          setTimeout(verifierPaiement, 3000);
        } else {
          etatFinal(false, "Verification impossible", "Nous n'avons pas pu verifier votre paiement pour le moment. Utilisez \"Deja reserve ? Retrouver mon billet\" sur la page Transport dans quelques minutes.");
        }
      });
    }

    verifierPaiement();
  }
}
</script>

</body>
</html>
