<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Admin Zones</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .aw-header { display: flex; justify-content: space-between; align-items: center; text-align: left; }
  .aw-header h1 { font-size: 17px; }
  .deconnexion { background-color: transparent; border: 1px solid var(--alerte); color: var(--alerte); padding: 8px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 600; font-family: var(--police-texte); }
  .back { display: inline-block; margin: var(--espace-md); color: var(--texte-doux); text-decoration: none; font-size: 14px; }
  .chargement { text-align: center; padding: 40px; color: var(--texte-doux); }
  .refus { text-align: center; padding: 40px; color: var(--alerte); }
  .vide { color: var(--texte-doux); font-size: 14px; padding: 15px; text-align: center; }

  .grille-kpi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: var(--espace-lg); }
  .kpi { background-color: var(--surface); border: 1px solid var(--bordure); border-radius: var(--rayon); padding: 14px; }
  .kpi .valeur { font-family: var(--police-chiffres); font-size: 24px; font-weight: 700; color: var(--accent); }
  .kpi .label { font-size: 11.5px; color: var(--texte-doux); margin-top: 2px; }

  .ligne-zone { display: flex; justify-content: space-between; align-items: center; background-color: var(--surface); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 13px 14px; margin-bottom: 8px; }
  .ligne-zone .nom-zone { font-size: 14.5px; font-weight: 600; color: var(--texte); }
  .ligne-zone .nom-zone.inactif { color: var(--texte-discret); }

  .carte-zone { background-color: var(--surface); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 13px 14px; margin-bottom: 8px; }
  .statut-coords { font-size: 11.5px; color: var(--alerte); margin-top: 8px; }
  .statut-coords.ok { color: var(--succes); }
  .btn-capturer { width: 100%; margin-top: 8px; background-color: var(--fond); border: 1px solid var(--accent); color: var(--accent); padding: 9px; border-radius: var(--rayon-petit); font-size: 12.5px; font-weight: 700; font-family: var(--police-texte); }

  .interrupteur { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
  .interrupteur input { opacity: 0; width: 0; height: 0; }
  .glissiere { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--fond); border: 1px solid var(--bordure); border-radius: 999px; transition: 0.15s; }
  .glissiere:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--texte-discret); border-radius: 50%; transition: 0.15s; }
  .interrupteur input:checked + .glissiere { background-color: var(--accent); border-color: var(--accent); }
  .interrupteur input:checked + .glissiere:before { transform: translateX(20px); background-color: #1C1200; }

  .form-ajout { display: flex; gap: 8px; margin-bottom: var(--espace-lg); }
  .form-ajout input { flex: 1; }
  .form-ajout button { flex-shrink: 0; }
  .msg-notif { font-size: 12px; margin-top: 8px; color: var(--texte-doux); }
  .msg-notif.ok { color: var(--succes); }
  .msg-notif.err { color: var(--alerte); }
</style>
</head>
<body>

<header class="aw-header">
  <h1>Admin — Zones</h1>
  <button class="deconnexion" id="btnDeconnexion">Deconnexion</button>
</header>

<a href="admin-espace.html" class="back">&#8592; Retour au tableau de bord</a>

<div class="aw-conteneur">
  <div id="zoneContenu" class="chargement">Verification des droits...</div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

var toutesLesZones = [];
var termeRecherche = "";

document.getElementById("btnDeconnexion").addEventListener("click", function() {
  sb.auth.signOut().then(function() {
    window.location.href = "admin-connexion.html";
  });
});

function verifierEtCharger() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "admin-connexion.html";
      return;
    }
    sb.from("admins").select("*").eq("user_id", user.id).single().then(function(reponseAdmin) {
      var admin = reponseAdmin.data;
      var zone = document.getElementById("zoneContenu");
      if (!admin) {
        zone.innerHTML = "<div class=\"refus\">Acces refuse. Ce compte n a pas les droits administrateur.</div>";
        return;
      }

      zone.innerHTML =
        "<div class=\"grille-kpi\">" +
          "<div class=\"kpi\"><div class=\"valeur\" id=\"kpiTotalZones\">-</div><div class=\"label\">Zones enregistrees</div></div>" +
          "<div class=\"kpi\"><div class=\"valeur\" id=\"kpiZonesActives\">-</div><div class=\"label\">Zones actives</div></div>" +
        "</div>" +

        "<p class=\"aw-section-titre\">Ajouter une zone</p>" +
        "<div class=\"form-ajout\">" +
          "<input class=\"aw-input\" type=\"text\" id=\"nouvelleZone\" placeholder=\"Nom du village...\">" +
          "<button type=\"button\" class=\"aw-btn aw-btn-primaire\" id=\"btnAjouterZone\">Ajouter</button>" +
        "</div>" +
        "<p class=\"msg-notif\" id=\"msgZone\"></p>" +

        "<p class=\"aw-section-titre\" style=\"margin-top:var(--espace-lg);\">Zones enregistrees</p>" +
        "<div class=\"aw-recherche\" style=\"margin-bottom:var(--espace-md);\">" +
          "<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"></circle><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"></line></svg>" +
          "<input type=\"text\" id=\"champRechercheZone\" placeholder=\"Rechercher un village...\">" +
        "</div>" +
        "<div id=\"listeZones\"><p class=\"vide\">Chargement...</p></div>";

      document.getElementById("btnAjouterZone").addEventListener("click", ajouterZone);
      document.getElementById("champRechercheZone").addEventListener("input", function() {
        termeRecherche = this.value.trim().toLowerCase();
        afficherZones();
      });

      chargerZones();
    });
  });
}

function chargerZones() {
  sb.from("zones_actives").select("*").order("nom", { ascending: true }).then(function(reponse) {
    toutesLesZones = reponse.data || [];
    var actives = toutesLesZones.filter(function(z) { return z.actif; }).length;
    document.getElementById("kpiTotalZones").textContent = toutesLesZones.length;
    document.getElementById("kpiZonesActives").textContent = actives;
    afficherZones();
  });
}

function afficherZones() {
  var zone = document.getElementById("listeZones");
  var filtrees = toutesLesZones.filter(function(z) {
    return !termeRecherche || z.nom.toLowerCase().indexOf(termeRecherche) !== -1;
  });

  if (filtrees.length === 0) {
    zone.innerHTML = "<p class=\"vide\">Aucun village ne correspond.</p>";
    return;
  }

  var html = "";
  for (var i = 0; i < filtrees.length; i++) {
    var z = filtrees[i];
    var aCoords = z.latitude && z.longitude;
    html += "<div class=\"carte-zone\">" +
              "<div class=\"ligne-zone\" style=\"margin-bottom:0;\">" +
                "<span class=\"nom-zone" + (z.actif ? "" : " inactif") + "\">" + z.nom + "</span>" +
                "<label class=\"interrupteur\">" +
                  "<input type=\"checkbox\" class=\"toggle-zone\" data-id=\"" + z.id + "\"" + (z.actif ? " checked" : "") + ">" +
                  "<span class=\"glissiere\"></span>" +
                "</label>" +
              "</div>" +
              "<p class=\"statut-coords" + (aCoords ? " ok" : "") + "\">" + (aCoords ? "Position GPS definie" : "Position GPS non definie (verification client desactivee pour ce village)") + "</p>" +
              "<button type=\"button\" class=\"btn-capturer\" data-id=\"" + z.id + "\">&#128205; " + (aCoords ? "Redefinir ma position ici" : "Je suis ici : capturer la position") + "</button>" +
            "</div>";
  }
  zone.innerHTML = html;

  var toggles = document.getElementsByClassName("toggle-zone");
  for (var t = 0; t < toggles.length; t++) {
    toggles[t].addEventListener("change", function(e) {
      var id = e.target.getAttribute("data-id");
      var nouvelEtat = e.target.checked;
      sb.from("zones_actives").update({ actif: nouvelEtat }).eq("id", id).then(function(reponse) {
        if (reponse.error) {
          alert("Erreur : " + reponse.error.message);
          e.target.checked = !nouvelEtat;
          return;
        }
        chargerZones();
      });
    });
  }

  var boutonsCapturer = document.getElementsByClassName("btn-capturer");
  for (var c = 0; c < boutonsCapturer.length; c++) {
    boutonsCapturer[c].addEventListener("click", function(e) {
      var btn = e.target;
      var id = btn.getAttribute("data-id");

      if (!navigator.geolocation) {
        alert("La localisation n'est pas disponible sur cet appareil.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Localisation en cours...";

      navigator.geolocation.getCurrentPosition(function(position) {
        sb.from("zones_actives").update({
          latitude: position.coords.latitude,
          longitude: position.coords.longitude
        }).eq("id", id).then(function(reponse) {
          if (reponse.error) {
            alert("Erreur : " + reponse.error.message);
          }
          chargerZones();
        });
      }, function() {
        btn.disabled = false;
        btn.textContent = "Je suis ici : capturer la position";
        alert("Impossible d'obtenir votre position. Verifiez que la localisation est activee.");
      });
    });
  }
}

function ajouterZone() {
  var champ = document.getElementById("nouvelleZone");
  var msg = document.getElementById("msgZone");
  var nom = champ.value.trim();

  if (!nom) {
    msg.className = "msg-notif err";
    msg.textContent = "Entrez un nom de village.";
    return;
  }

  sb.from("zones_actives").insert([{ nom: nom, actif: true }]).then(function(reponse) {
    if (reponse.error) {
      msg.className = "msg-notif err";
      if (reponse.error.code === "23505") {
        msg.textContent = "Ce village existe deja dans la liste.";
      } else {
        msg.textContent = "Erreur : " + reponse.error.message;
      }
      return;
    }
    msg.className = "msg-notif ok";
    msg.textContent = "Village ajoute et active !";
    champ.value = "";
    chargerZones();
  });
}

verifierEtCharger();
</script>

</body>
</html>
