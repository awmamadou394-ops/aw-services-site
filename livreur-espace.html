<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Mon Espace Livreur</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .aw-header { display: flex; justify-content: space-between; align-items: center; text-align: left; }
  .aw-header h1 { font-size: 18px; }
  .deconnexion { background-color: transparent; border: 1px solid var(--alerte); color: var(--alerte); padding: 8px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 600; font-family: var(--police-texte); }
  .chargement { text-align: center; padding: 40px; color: var(--texte-doux); }

  .commande-carte { background-color: var(--fond); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 12px; margin-bottom: 10px; }
  .commande-carte h3 { font-size: 14px; font-family: var(--police-titre); }
  .date-commande { font-size: 11px; color: var(--texte-discret); margin-bottom: 4px; }
  .commande-carte p { font-size: 13px; color: var(--texte-doux); margin-top: 3px; }
  .badges { margin-top: 8px; }
  .badge-statut { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-right: 5px; margin-bottom: 4px; }
  .badge-nouvelle { background-color: rgba(242,169,59,0.15); color: var(--accent); }
  .badge-en_preparation { background-color: rgba(107,169,255,0.15); color: #6aa9ff; }
  .badge-prete { background-color: rgba(63,163,77,0.15); color: var(--succes); }

  .btn-maps { display: inline-block; background-color: var(--accent); color: #1C1200; text-decoration: none; padding: 9px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 700; margin-top: 8px; margin-right: 6px; }
  .btn-accepter { background-color: rgba(63,163,77,0.15); color: var(--succes); border: 1px solid var(--succes); padding: 9px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 700; margin-top: 8px; font-family: var(--police-texte); }
  .btn-recupere { background-color: rgba(192,140,255,0.15); color: #c08cff; border: 1px solid #c08cff; padding: 9px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 700; margin-top: 8px; font-family: var(--police-texte); }
  .btn-livree { background-color: var(--accent); color: #1C1200; border: none; padding: 9px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 700; margin-top: 8px; font-family: var(--police-texte); }
  .attente-vendeur { color: var(--accent); font-size: 12px; margin-top: 8px; }
  .sans-position { color: var(--accent); font-size: 12px; margin-top: 8px; }

  .msg-notif { font-size: 12px; margin-top: 8px; color: var(--texte-doux); }
  .msg-notif.ok { color: var(--succes); }
  .msg-notif.err { color: var(--alerte); }
</style>
</head>
<body>

<header class="aw-header">
  <h1>Mon Espace Livreur</h1>
  <button class="deconnexion" id="btnDeconnexion">Deconnexion</button>
</header>

<div class="aw-conteneur">
  <div id="zoneContenu" class="chargement">Chargement...</div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

var VAPID_PUBLIC_KEY = "BJw5df2L2JS-HB2BoXP7QNx1caYe4F1PaLbXy6kY1KI7SY9Evt5GjH19HsacU1iT9547pf6sjUeVsThHd8mOkr0";
var livreurCourant = null;
var positionLivreur = null;

var LIBELLES_PREPARATION = {
  nouvelle: "Commande recue",
  en_preparation: "En preparation",
  prete: "Prete a recuperer"
};

document.getElementById("btnDeconnexion").addEventListener("click", function() {
  sb.auth.signOut().then(function() {
    window.location.href = "livreur-connexion.html";
  });
});

function chargerEspace() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "livreur-connexion.html";
      return;
    }
    sb.from("livreurs").select("*").eq("user_id", user.id).single().then(function(reponse) {
      var livreur = reponse.data;
      var zone = document.getElementById("zoneContenu");
      if (reponse.error || !livreur) {
        zone.innerHTML = "<div class=\"aw-carte\"><p>Profil introuvable. Contactez AW SERVICES.</p></div>";
        return;
      }
      livreurCourant = livreur;
      var statutLabel = livreur.statut === "approuve" ? "Approuve" : "En attente de validation";
      var classeStatut = livreur.statut === "approuve" ? "aw-badge-succes" : "aw-badge-attente";

      zone.innerHTML =
        "<div class=\"aw-carte\">" +
          "<p class=\"aw-section-titre\">Bienvenue, " + livreur.nom + "</p>" +
          "<span class=\"aw-badge " + classeStatut + "\">" + statutLabel + "</span>" +
          "<p style=\"margin-top:10px;color:var(--texte-doux);font-size:14px;\">Telephone : " + livreur.telephone + "</p>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Notifications</p>" +
          "<p style=\"color:var(--texte-doux);font-size:13.5px;margin-bottom:10px;\">Recevez une alerte des qu'une nouvelle commande arrive.</p>" +
          "<button class=\"aw-btn aw-btn-primaire\" id=\"btnActiverNotif\" style=\"width:100%;\">Activer les notifications</button>" +
          "<p class=\"msg-notif\" id=\"msgNotif\"></p>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Mes livraisons en cours</p>" +
          "<div id=\"listeMesCommandes\"><p style=\"color:var(--texte-doux);\">Chargement...</p></div>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Commandes disponibles</p>" +
          "<div id=\"listeDisponibles\"><p style=\"color:var(--texte-doux);\">Chargement...</p></div>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Mes courses moto en cours</p>" +
          "<div id=\"listeMesCourses\"><p style=\"color:var(--texte-doux);\">Chargement...</p></div>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Courses moto disponibles</p>" +
          "<p style=\"color:var(--texte-doux);font-size:13px;\" id=\"infoPositionLivreur\">Localisation en cours pour trier par distance...</p>" +
          "<div id=\"listeCoursesDisponibles\"><p style=\"color:var(--texte-doux);\">Chargement...</p></div>" +
        "</div>";

      document.getElementById("btnActiverNotif").addEventListener("click", activerNotifications);
      verifierEtatNotifications();
      localiserLivreur();
      chargerCommandes();
      chargerCourses();
      reprendrePartageSiCourseActive();
      setInterval(chargerCommandes, 20000);
      setInterval(chargerCourses, 20000);
    });
  });
}

function localiserLivreur() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(position) {
    positionLivreur = { lat: position.coords.latitude, lng: position.coords.longitude };
    var info = document.getElementById("infoPositionLivreur");
    if (info) info.textContent = "Triees par distance depuis votre position.";
    chargerCourses();
  }, function() {
    var info = document.getElementById("infoPositionLivreur");
    if (info) info.textContent = "Position non disponible : activez la localisation pour trier par distance.";
  });
}

function distanceKm(lat1, lon1, lat2, lon2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function afficherNotifActives() {
  var btn = document.getElementById("btnActiverNotif");
  var msg = document.getElementById("msgNotif");
  btn.disabled = true;
  btn.textContent = "Notifications activees";
  msg.className = "msg-notif ok";
  msg.textContent = "Vous recevrez une alerte a chaque nouvelle commande.";
}

function verifierEtatNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  if (Notification.permission !== "granted") return;
  navigator.serviceWorker.getRegistration().then(function(registration) {
    if (!registration) return;
    registration.pushManager.getSubscription().then(function(subscription) {
      if (subscription) afficherNotifActives();
    });
  });
}

function urlBase64ToUint8Array(base64String) {
  var padding = "=".repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for (var i = 0; i < rawData.length; i++) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

function activerNotifications() {
  var btn = document.getElementById("btnActiverNotif");
  var msg = document.getElementById("msgNotif");

  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    msg.className = "msg-notif err";
    msg.textContent = "Les notifications ne sont pas prises en charge sur cet appareil/navigateur.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Activation en cours...";

  navigator.serviceWorker.register("sw.js").then(function(registration) {
    return Notification.requestPermission().then(function(permission) {
      if (permission !== "granted") {
        throw new Error("Permission refusee");
      }
      return registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    });
  }).then(function(subscription) {
    var sub = subscription.toJSON();
    return sb.from("push_subscriptions").select("id").eq("subscription->>endpoint", sub.endpoint).then(function(existant) {
      if (existant.data && existant.data.length > 0) {
        return { error: null };
      }
      return sb.from("push_subscriptions").insert([{
        livreur_id: livreurCourant.id,
        subscription: sub
      }]);
    });
  }).then(function(reponse) {
    afficherNotifActives();
  }).catch(function(erreur) {
    btn.disabled = false;
    btn.textContent = "Activer les notifications";
    msg.className = "msg-notif err";
    msg.textContent = "Impossible d'activer les notifications. Verifiez les autorisations de votre navigateur.";
  });
}

function chargerCommandes() {
  sb.from("commandes").select("*").order("date_commande", { ascending: false }).then(function(reponse) {
    var data = reponse.data || [];
    var mesCommandes = data.filter(function(c) { return c.livreur_id === livreurCourant.id && c.statut_livraison !== "livree"; });
    var disponibles = data.filter(function(c) { return c.livreur_id === null; });

    afficherListe("listeMesCommandes", mesCommandes, false);
    afficherListe("listeDisponibles", disponibles, true);
  });
}

function afficherListe(idZone, liste, avecBoutonAccepter) {
  var zone = document.getElementById(idZone);
  if (liste.length === 0) {
    zone.innerHTML = "<p style=\"color:var(--texte-doux);\">Aucune commande pour le moment.</p>";
    return;
  }
  var html = "";
  for (var i = 0; i < liste.length; i++) {
    var c = liste[i];
    var statutPrep = c.statut || "nouvelle";
    var statutLiv = c.statut_livraison || "en_attente_livreur";
    var libellePrep = LIBELLES_PREPARATION[statutPrep] || statutPrep;
    var dateAffichee = c.date_commande ? new Date(c.date_commande).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "Date inconnue";

    html += "<div class=\"commande-carte\">" +
              "<p class=\"date-commande\">" + dateAffichee + "</p>" +
              "<h3>" + c.client_nom + "</h3>" +
              "<p>Telephone : " + c.client_telephone + "</p>" +
              "<p>" + c.produit + "</p>" +
              "<p>Adresse : " + c.adresse_livraison + "</p>" +
              "<p>Paiement : " + c.mode_paiement + "</p>" +
              "<div class=\"badges\"><span class=\"badge-statut badge-" + statutPrep + "\">" + libellePrep + "</span></div>";

    if (c.latitude && c.longitude) {
      html += "<a class=\"btn-maps\" href=\"https://www.google.com/maps/dir/?api=1&destination=" + c.latitude + "," + c.longitude + "\" target=\"_blank\">Itineraire client</a>";
    } else {
      html += "<p class=\"sans-position\">Position GPS non fournie par le client.</p>";
    }

    if (avecBoutonAccepter) {
      html += "<br><button class=\"btn-accepter btn-accepter-cmd\" data-id=\"" + c.id + "\">Accepter cette commande</button>";
    } else if (statutLiv === "vers_boutique") {
      if (statutPrep !== "prete") {
        html += "<p class=\"attente-vendeur\">En attente : le vendeur prepare encore la commande.</p>";
      }
      html += "<button class=\"btn-recupere btn-recupere-cmd\" data-id=\"" + c.id + "\">J'ai recupere la commande</button>";
    } else if (statutLiv === "en_livraison") {
      html += "<br><button class=\"btn-livree btn-livree-cmd\" data-id=\"" + c.id + "\">Marquer comme livree</button>";
    }
    html += "</div>";
  }
  zone.innerHTML = html;

  if (avecBoutonAccepter) {
    var boutonsAccepter = document.getElementsByClassName("btn-accepter-cmd");
    for (var b = 0; b < boutonsAccepter.length; b++) {
      boutonsAccepter[b].addEventListener("click", function(e) {
        accepterCommande(e.target.getAttribute("data-id"));
      });
    }
  } else {
    var boutonsRecupere = document.getElementsByClassName("btn-recupere-cmd");
    for (var r = 0; r < boutonsRecupere.length; r++) {
      boutonsRecupere[r].addEventListener("click", function(e) {
        majLivraison(e.target.getAttribute("data-id"), "en_livraison");
      });
    }
    var boutonsLivree = document.getElementsByClassName("btn-livree-cmd");
    for (var l = 0; l < boutonsLivree.length; l++) {
      boutonsLivree[l].addEventListener("click", function(e) {
        majLivraison(e.target.getAttribute("data-id"), "livree");
      });
    }
  }
}

function accepterCommande(id) {
  sb.from("commandes").update({ livreur_id: livreurCourant.id, statut_livraison: "vers_boutique" }).eq("id", id).then(function(reponse) {
    if (reponse.error) {
      alert("Erreur : cette commande a peut-etre deja ete prise par un autre livreur.");
    }
    chargerCommandes();
  });
}

function majLivraison(id, nouveauStatut) {
  sb.from("commandes").update({ statut_livraison: nouveauStatut }).eq("id", id).then(function(reponse) {
    if (reponse.error) {
      alert("Erreur : " + reponse.error.message);
    }
    chargerCommandes();
  });
}

var LIBELLES_COURSE = {
  nouvelle: "En attente d'un livreur",
  acceptee: "En route vers le client",
  en_cours: "Client recupere, en route vers la destination"
};

function chargerCourses() {
  sb.from("courses_moto").select("*").neq("statut", "terminee").then(function(reponse) {
    var data = reponse.data || [];
    var mesCourses = data.filter(function(c) { return c.livreur_id === livreurCourant.id; });
    var disponibles = data.filter(function(c) { return c.livreur_id === null && c.statut === "nouvelle"; });

    if (positionLivreur) {
      disponibles.sort(function(a, b) {
        if (!a.latitude || !a.longitude) return 1;
        if (!b.latitude || !b.longitude) return -1;
        var da = distanceKm(positionLivreur.lat, positionLivreur.lng, a.latitude, a.longitude);
        var db = distanceKm(positionLivreur.lat, positionLivreur.lng, b.latitude, b.longitude);
        return da - db;
      });
    }

    afficherMesCourses(mesCourses);
    afficherCoursesDisponibles(disponibles);
  });
}

function afficherMesCourses(liste) {
  var zone = document.getElementById("listeMesCourses");
  if (liste.length === 0) {
    zone.innerHTML = "<p style=\"color:var(--texte-doux);\">Aucune course en cours.</p>";
    return;
  }
  var html = "";
  for (var i = 0; i < liste.length; i++) {
    var c = liste[i];
    html += "<div class=\"commande-carte\">" +
              "<h3>" + c.client_nom + "</h3>" +
              "<p>Telephone : " + c.client_telephone + "</p>" +
              "<p>Destination : " + c.lieu_arrivee + "</p>" +
              (c.lieu_depart ? "<p>Repere : " + c.lieu_depart + "</p>" : "") +
              "<p>Paiement : " + c.mode_paiement + "</p>" +
              "<div class=\"badges\"><span class=\"badge-statut badge-en_preparation\">" + (LIBELLES_COURSE[c.statut] || c.statut) + "</span></div>";

    if (c.statut === "en_cours") {
      if (c.destination_latitude && c.destination_longitude) {
        html += "<a class=\"btn-maps\" href=\"https://www.google.com/maps/dir/?api=1&destination=" + c.destination_latitude + "," + c.destination_longitude + "\" target=\"_blank\">Itineraire vers la destination</a>";
      } else {
        html += "<a class=\"btn-maps\" href=\"https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(c.lieu_arrivee) + "\" target=\"_blank\">Itineraire vers la destination</a>";
      }
    } else if (c.latitude && c.longitude) {
      html += "<a class=\"btn-maps\" href=\"https://www.google.com/maps/dir/?api=1&destination=" + c.latitude + "," + c.longitude + "\" target=\"_blank\">Itineraire vers le client</a>";
    }

    if (c.statut === "acceptee") {
      html += "<br><button class=\"btn-recupere btn-recupere-course\" data-id=\"" + c.id + "\">J'ai recupere le client</button>";
    } else if (c.statut === "en_cours") {
      html += "<br><button class=\"btn-livree btn-termine-course\" data-id=\"" + c.id + "\">Course terminee</button>";
    }
    html += "</div>";
  }
  zone.innerHTML = html;

  var boutonsRecupere = document.getElementsByClassName("btn-recupere-course");
  for (var r = 0; r < boutonsRecupere.length; r++) {
    boutonsRecupere[r].addEventListener("click", function(e) {
      majCourse(e.target.getAttribute("data-id"), "en_cours");
    });
  }
  var boutonsTermine = document.getElementsByClassName("btn-termine-course");
  for (var t = 0; t < boutonsTermine.length; t++) {
    boutonsTermine[t].addEventListener("click", function(e) {
      majCourse(e.target.getAttribute("data-id"), "terminee");
    });
  }
}

function afficherCoursesDisponibles(liste) {
  var zone = document.getElementById("listeCoursesDisponibles");
  if (liste.length === 0) {
    zone.innerHTML = "<p style=\"color:var(--texte-doux);\">Aucune course disponible pour le moment.</p>";
    return;
  }
  var html = "";
  for (var i = 0; i < liste.length; i++) {
    var c = liste[i];
    var texteDistance = "";
    if (positionLivreur && c.latitude && c.longitude) {
      texteDistance = " - " + distanceKm(positionLivreur.lat, positionLivreur.lng, c.latitude, c.longitude).toFixed(1) + " km";
    }
    html += "<div class=\"commande-carte\">" +
              "<h3>" + c.client_nom + texteDistance + "</h3>" +
              "<p>Telephone : " + c.client_telephone + "</p>" +
              "<p>Destination : " + c.lieu_arrivee + "</p>" +
              (c.lieu_depart ? "<p>Repere : " + c.lieu_depart + "</p>" : "") +
              "<p>Paiement : " + c.mode_paiement + "</p>";
    if (c.latitude && c.longitude) {
      html += "<a class=\"btn-maps\" href=\"https://www.google.com/maps/dir/?api=1&destination=" + c.latitude + "," + c.longitude + "\" target=\"_blank\">Itineraire vers le client</a>";
    }
    html += "<br><button class=\"btn-accepter btn-accepter-course\" data-id=\"" + c.id + "\">Accepter cette course</button>" +
            "</div>";
  }
  zone.innerHTML = html;

  var boutonsAccepter = document.getElementsByClassName("btn-accepter-course");
  for (var a = 0; a < boutonsAccepter.length; a++) {
    boutonsAccepter[a].addEventListener("click", function(e) {
      accepterCourse(e.target.getAttribute("data-id"));
    });
  }
}

function accepterCourse(id) {
  sb.from("courses_moto").update({ livreur_id: livreurCourant.id, statut: "acceptee" }).eq("id", id).eq("statut", "nouvelle").then(function(reponse) {
    if (reponse.error) {
      alert("Erreur : cette course a peut-etre deja ete prise par un autre livreur.");
    } else {
      demarrerPartagePosition(id);
    }
    chargerCourses();
  });
}

function majCourse(id, nouveauStatut) {
  sb.from("courses_moto").update({ statut: nouveauStatut }).eq("id", id).then(function(reponse) {
    if (reponse.error) {
      alert("Erreur : " + reponse.error.message);
    }
    if (nouveauStatut === "terminee") {
      arreterPartagePosition();
    }
    chargerCourses();
  });
}

var minuteurPartagePosition = null;
var idCourseSuivie = null;

function demarrerPartagePosition(idCourse) {
  if (!navigator.geolocation) return;
  arreterPartagePosition();
  idCourseSuivie = idCourse;

  function envoyerPosition() {
    navigator.geolocation.getCurrentPosition(function(position) {
      sb.from("courses_moto").update({
        livreur_latitude: position.coords.latitude,
        livreur_longitude: position.coords.longitude,
        livreur_position_maj: new Date().toISOString()
      }).eq("id", idCourseSuivie).then(function() {});
    }, function() {});
  }

  envoyerPosition();
  minuteurPartagePosition = setInterval(envoyerPosition, 10000);
}

function arreterPartagePosition() {
  if (minuteurPartagePosition) {
    clearInterval(minuteurPartagePosition);
    minuteurPartagePosition = null;
  }
  idCourseSuivie = null;
}

function reprendrePartageSiCourseActive() {
  sb.from("courses_moto").select("id, statut").eq("livreur_id", livreurCourant.id).in("statut", ["acceptee", "en_cours"]).limit(1).then(function(reponse) {
    if (reponse.data && reponse.data[0]) {
      demarrerPartagePosition(reponse.data[0].id);
    }
  });
}

chargerEspace();
</script>
