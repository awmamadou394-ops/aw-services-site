<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Admin Voyage</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .aw-header { display: flex; justify-content: space-between; align-items: center; text-align: left; }
  .aw-header h1 { font-size: 17px; }
  .deconnexion { background-color: transparent; border: 1px solid var(--alerte); color: var(--alerte); padding: 8px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 600; font-family: var(--police-texte); }
  .back { display: inline-block; margin: var(--espace-md); color: var(--texte-doux); text-decoration: none; font-size: 14px; }
  .chargement { text-align: center; padding: 40px; color: var(--texte-doux); }
  .refus { text-align: center; padding: 40px; color: var(--alerte); }
  .vide { color: var(--texte-doux); font-size: 14px; padding: 15px; text-align: center; }

  .filtre-pays { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--espace-lg); scrollbar-width: none; }
  .filtre-pays::-webkit-scrollbar { display: none; }
  .puce-pays { flex: 0 0 auto; background-color: var(--surface); border: 1px solid var(--bordure); color: var(--texte-doux); padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .puce-pays.actif { background-color: var(--accent); border-color: var(--accent); color: #1C1200; }

  .carte-item { background-color: var(--surface); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 14px; margin-bottom: 10px; }
  .carte-item h3 { font-size: 15px; font-family: var(--police-titre); margin-bottom: 4px; }
  .carte-item p { font-size: 13px; color: var(--texte-doux); margin-top: 3px; }
  .ligne-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .badge-statut { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge-paye { background-color: rgba(63,163,77,0.15); color: var(--succes); }
  .badge-nonpaye { background-color: rgba(232,72,58,0.15); color: var(--alerte); }
  .badge-devis { background-color: rgba(107,169,255,0.15); color: #6aa9ff; }
  .badge-pays { background-color: var(--fond); color: var(--texte-doux); }

  .liste-documents { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .lien-document { background-color: var(--fond); border: 1px solid var(--bordure); color: var(--accent); text-decoration: none; padding: 5px 10px; border-radius: var(--rayon-petit); font-size: 11.5px; font-weight: 600; }
</style>
</head>
<body>

<header class="aw-header">
  <h1>Admin — Voyage</h1>
  <button class="deconnexion" id="btnDeconnexion">Deconnexion</button>
</header>

<a href="admin-espace.html" class="back">&#8592; Retour au tableau de bord</a>

<div class="aw-conteneur">
  <div id="zoneContenu" class="chargement">Verification des droits...</div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

var PAYS_LISTE = ["Tous", "France", "Canada", "USA", "Maroc", "Belgique", "Russie"];
var filtrePays = "Tous";

document.getElementById("btnDeconnexion").addEventListener("click", function() {
  sb.auth.signOut().then(function() {
    window.location.href = "admin-connexion.html";
  });
});

function verifierEtCharger() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "admin-connexion.html";
      return;
    }
    sb.from("admins").select("*").eq("user_id", user.id).single().then(function(reponseAdmin) {
      var admin = reponseAdmin.data;
      var zone = document.getElementById("zoneContenu");
      if (!admin) {
        zone.innerHTML = "<div class=\"refus\">Acces refuse. Ce compte n a pas les droits administrateur.</div>";
        return;
      }

      var htmlPuces = "";
      for (var i = 0; i < PAYS_LISTE.length; i++) {
        var actif = PAYS_LISTE[i] === filtrePays ? " actif" : "";
        htmlPuces += "<button type=\"button\" class=\"puce-pays" + actif + "\" data-pays=\"" + PAYS_LISTE[i] + "\">" + PAYS_LISTE[i] + "</button>";
      }

      zone.innerHTML =
        "<div class=\"filtre-pays\" id=\"filtrePaysZone\">" + htmlPuces + "</div>" +
        "<div id=\"listePreinscriptions\"><p class=\"vide\">Chargement...</p></div>";

      var puces = document.getElementsByClassName("puce-pays");
      for (var p = 0; p < puces.length; p++) {
        puces[p].addEventListener("click", function() {
          filtrePays = this.getAttribute("data-pays");
          var tous = document.getElementsByClassName("puce-pays");
          for (var t = 0; t < tous.length; t++) tous[t].classList.remove("actif");
          this.classList.add("actif");
          chargerPreinscriptions();
        });
      }

      chargerPreinscriptions();
    });
  });
}

function chargerPreinscriptions() {
  var zone = document.getElementById("listePreinscriptions");
  zone.innerHTML = "<p class=\"vide\">Chargement...</p>";

  var requete = sb.from("preinscriptions_voyage").select("*").limit(100);
  if (filtrePays !== "Tous") {
    requete = requete.eq("pays", filtrePays);
  }

  requete.then(function(reponse) {
    var data = reponse.data || [];
    if (data.length === 0) { zone.innerHTML = "<p class=\"vide\">Aucune pre-inscription.</p>"; return; }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var p = data[i];
      var badgePaiement = "";
      if (p.pays === "Russie") {
        badgePaiement = "<span class=\"badge-statut badge-devis\">Sur devis</span>";
      } else if (p.statut_paiement === "paye") {
        badgePaiement = "<span class=\"badge-statut badge-paye\">Paye" + (p.montant_frais ? " - " + Number(p.montant_frais).toLocaleString("fr-FR") + " FCFA" : "") + "</span>";
      } else {
        badgePaiement = "<span class=\"badge-statut badge-nonpaye\">Non paye" + (p.montant_frais ? " - " + Number(p.montant_frais).toLocaleString("fr-FR") + " FCFA" : "") + "</span>";
      }

      var htmlDocuments = "";
      if (p.documents && p.documents.length > 0) {
        htmlDocuments = "<div class=\"liste-documents\">";
        for (var d = 0; d < p.documents.length; d++) {
          htmlDocuments += "<a class=\"lien-document\" href=\"" + p.documents[d] + "\" target=\"_blank\">Document " + (d + 1) + "</a>";
        }
        htmlDocuments += "</div>";
      }

      html += "<div class=\"carte-item\">" +
                "<h3>" + p.nom + "</h3>" +
                "<p>Telephone : " + p.telephone + "</p>" +
                "<p>Niveau : " + p.niveau + "</p>" +
                "<div class=\"ligne-badges\">" +
                  "<span class=\"badge-statut badge-pays\">" + p.pays + "</span>" +
                  badgePaiement +
                "</div>" +
                htmlDocuments +
              "</div>";
    }
    zone.innerHTML = html;
  });
}

verifierEtCharger();
</script>

</body>
</html>
