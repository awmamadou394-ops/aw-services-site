<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Gestion Immobilier</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .back { display: inline-block; margin: var(--espace-md); color: var(--texte-doux); text-decoration: none; font-size: 14px; }

  .stat-carte { background-color: var(--surface); border: 1px solid var(--accent); border-radius: var(--rayon); padding: 18px; text-align: center; margin-bottom: var(--espace-lg); box-shadow: var(--ombre-accent); }
  .stat-carte .chiffre { color: var(--accent); font-size: 30px; font-weight: 700; font-family: var(--police-chiffres); }
  .stat-carte .label { color: var(--texte-doux); font-size: 13px; margin-top: 4px; }

  .msg { font-size: 14px; padding: 10px; border-radius: var(--rayon-petit); margin-bottom: 12px; }
  .msg.erreur { background-color: rgba(232,72,58,0.12); color: var(--alerte); }
  .msg.succes { background-color: rgba(63,163,77,0.12); color: var(--succes); }

  .bien-carte { display: flex; gap: 10px; background-color: var(--fond); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 10px; margin-bottom: 10px; }
  .bien-carte img { width: 60px; height: 60px; border-radius: var(--rayon-petit); object-fit: cover; background-color: var(--surface); }
  .bien-info { flex: 1; }
  .bien-info h3 { font-size: 14px; font-family: var(--police-titre); }
  .bien-info p { font-size: 12px; color: var(--texte-doux); margin-top: 2px; }
  .boutons-bien { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .btn-action { background-color: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 6px 10px; border-radius: var(--rayon-petit); font-size: 12px; margin: 0; font-family: var(--police-texte); }
  .btn-suppr { border-color: var(--alerte); color: var(--alerte); }
  .badge-vendu { background-color: rgba(232,72,58,0.12); color: var(--alerte); font-size: 11px; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-top: 4px; }
  .chargement { text-align: center; padding: 30px; color: var(--texte-doux); }
  select { width: 100%; background-color: var(--fond); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 12px; color: var(--texte); font-family: var(--police-texte); font-size: 14px; }
</style>
</head>
<body>

<header class="aw-header">
  <h1>Gestion Immobilier</h1>
</header>

<a href="admin-espace.html" class="back">&#8592; Retour a l'administration</a>

<div class="aw-conteneur">
  <div id="zoneContenu" class="chargement">Verification des droits...</div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

function verifierEtCharger() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "admin-connexion.html";
      return;
    }
    sb.from("admins").select("*").eq("user_id", user.id).single().then(function(reponseAdmin) {
      var admin = reponseAdmin.data;
      var zone = document.getElementById("zoneContenu");
      if (!admin) {
        zone.innerHTML = "<div class=\"aw-carte\"><p>Acces refuse.</p></div>";
        return;
      }
      zone.innerHTML =
        "<div class=\"stat-carte\">" +
          "<div class=\"chiffre\" id=\"compteurVendus\">...</div>" +
          "<div class=\"label\">biens vendus sur la plateforme</div>" +
        "</div>" +
        "<div class=\"aw-carte\">" +
          "<p class=\"aw-section-titre\">Ajouter un bien</p>" +
          "<div id=\"zoneMessage\"></div>" +
          "<form id=\"formBien\">" +
            "<label class=\"aw-label\">Titre</label>" +
            "<input class=\"aw-input\" type=\"text\" id=\"b_titre\" placeholder=\"Ex : Terrain 300m2 Doumga\" required>" +
            "<label class=\"aw-label\">Description</label>" +
            "<textarea class=\"aw-textarea\" id=\"b_description\" rows=\"3\" placeholder=\"Decrivez le bien\"></textarea>" +
            "<label class=\"aw-label\">Prix (FCFA)</label>" +
            "<input class=\"aw-input\" type=\"number\" id=\"b_prix\" placeholder=\"Ex : 5000000\" required>" +
            "<label class=\"aw-label\">Type de bien</label>" +
            "<select id=\"b_type\" required>" +
              "<option value=\"\">Choisir...</option>" +
              "<option value=\"Terrain\">Terrain</option>" +
              "<option value=\"Maison\">Maison</option>" +
              "<option value=\"Appartement\">Appartement</option>" +
              "<option value=\"Local commercial\">Local commercial</option>" +
            "</select>" +
            "<label class=\"aw-label\">Localisation</label>" +
            "<input class=\"aw-input\" type=\"text\" id=\"b_localisation\" placeholder=\"Ville / quartier\" required>" +
            "<label class=\"aw-label\">Photos (plusieurs possibles)</label>" +
            "<input type=\"file\" id=\"b_images\" accept=\"image/*\" multiple required style=\"background-color:var(--fond);border:1px solid var(--bordure);border-radius:var(--rayon-petit);padding:10px;color:var(--texte-doux);font-size:12px;\">" +
            "<button type=\"submit\" class=\"aw-btn aw-btn-primaire\" id=\"btn_bien\" style=\"width:100%;margin-top:10px;\">Publier le bien</button>" +
          "</form>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Biens publies</p>" +
          "<div id=\"listeBiens\"><p style=\"color:var(--texte-doux);\">Chargement...</p></div>" +
        "</div>";

      document.getElementById("formBien").addEventListener("submit", ajouterBien);
      chargerCompteur();
      chargerBiens();
    });
  });
}

function chargerCompteur() {
  sb.from("biens_immobiliers").select("*", { count: "exact", head: true }).eq("statut", "vendu").then(function(reponse) {
    document.getElementById("compteurVendus").textContent = reponse.count || 0;
  });
}

function chargerBiens() {
  sb.from("biens_immobiliers").select("*").order("date_ajout", { ascending: false }).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeBiens");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p style=\"color:var(--texte-doux);\">Aucun bien pour le moment.</p>";
      return;
    }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var b = data[i];
      var image = (b.images && b.images[0]) ? b.images[0] : "";
      var actionVente = (b.statut === "vendu")
        ? "<span class=\"badge-vendu\">Deja vendu</span>"
        : "<button class=\"btn-action btn-vendu-action\" data-id=\"" + b.id + "\">Marquer vendu</button>";
      html += "<div class=\"bien-carte\">" +
                "<img src=\"" + image + "\" alt=\"\">" +
                "<div class=\"bien-info\">" +
                  "<h3>" + b.titre + "</h3>" +
                  "<p>" + Number(b.prix).toLocaleString("fr-FR") + " FCFA - " + b.localisation + "</p>" +
                  "<div class=\"boutons-bien\">" +
                    actionVente +
                    "<button class=\"btn-action btn-suppr btn-suppr-action\" data-id=\"" + b.id + "\">Supprimer</button>" +
                  "</div>" +
                "</div>" +
              "</div>";
    }
    zone.innerHTML = html;

    var boutonsVendu = document.getElementsByClassName("btn-vendu-action");
    for (var j = 0; j < boutonsVendu.length; j++) {
      boutonsVendu[j].addEventListener("click", function(e) {
        marquerVendu(e.target.getAttribute("data-id"));
      });
    }
    var boutonsSuppr = document.getElementsByClassName("btn-suppr-action");
    for (var k = 0; k < boutonsSuppr.length; k++) {
      boutonsSuppr[k].addEventListener("click", function(e) {
        supprimerBien(e.target.getAttribute("data-id"));
      });
    }
  });
}

function marquerVendu(id) {
  sb.from("biens_immobiliers").update({ statut: "vendu", date_vente: new Date().toISOString() }).eq("id", id).then(function() {
    chargerCompteur();
    chargerBiens();
  });
}

function supprimerBien(id) {
  if (!confirm("Supprimer definitivement ce bien ?")) return;
  sb.from("biens_immobiliers").delete().eq("id", id).then(function() {
    chargerCompteur();
    chargerBiens();
  });
}

function ajouterBien(event) {
  event.preventDefault();
  var btn = document.getElementById("btn_bien");
  var zoneMsg = document.getElementById("zoneMessage");
  btn.disabled = true;
  btn.textContent = "Publication en cours...";
  zoneMsg.innerHTML = "";

  var titre = document.getElementById("b_titre").value;
  var description = document.getElementById("b_description").value;
  var prix = document.getElementById("b_prix").value;
  var type_bien = document.getElementById("b_type").value;
  var localisation = document.getElementById("b_localisation").value;
  var fichiers = document.getElementById("b_images").files;
  var urls = [];
  var compteur = 0;
  var total = fichiers.length;

  if (total === 0) {
    finaliserAjout();
    return;
  }

  for (var i = 0; i < total; i++) {
    (function(fichier, index) {
      var nomFichier = "bien_" + Date.now() + "_" + index + "_" + fichier.name;
      sb.storage.from("immobilier").upload(nomFichier, fichier).then(function(reponseUpload) {
        if (!reponseUpload.error) {
          var urlData = sb.storage.from("immobilier").getPublicUrl(nomFichier);
          urls.push(urlData.data.publicUrl);
        }
        compteur++;
        if (compteur === total) finaliserAjout();
      });
    })(fichiers[i], i);
  }

  function finaliserAjout() {
    sb.from("biens_immobiliers").insert([{
      titre: titre,
      description: description,
      prix: prix,
      type_bien: type_bien,
      localisation: localisation,
      images: urls
    }]).then(function(reponse) {
      btn.disabled = false;
      btn.textContent = "Publier le bien";
      if (reponse.error) {
        zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + "</div>";
        return;
      }
      zoneMsg.innerHTML = "<div class=\"msg succes\">Bien publie avec succes !</div>";
      document.getElementById("formBien").reset();
      chargerBiens();
    });
  }
}

verifierEtCharger();
</script>

</body>
</html>
