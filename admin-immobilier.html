function escapeHtml(texte) {
  if (texte === null || texte === undefined) return "";
  return String(texte)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function nomFichierSur(prefixe, fichier, index) {
  var extension = (fichier.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
  return prefixe + "_" + Date.now() + "_" + index + "_" + Math.random().toString(36).slice(2, 8) + "." + (extension || "jpg");
}

var MOIS_FR = ["janv.","fevr.","mars","avr.","mai","juin","juil.","aout","sept.","oct.","nov.","dec."];
function dateCourte(dateStr) {
  if (!dateStr) return "";
  var p = dateStr.split("-");
  if (p.length !== 3) return dateStr;
  return parseInt(p[2], 10) + " " + MOIS_FR[parseInt(p[1], 10) - 1] + " " + p[0];
}

/* ================= BIENS A VENDRE ================= */

function chargerCompteur() {
  sb.from("biens_immobiliers").select("*", { count: "exact", head: true }).eq("statut", "vendu").then(function(reponse) {
    document.getElementById("compteurVendus").textContent = reponse.count || 0;
  });
}

function chargerBiens() {
  sb.from("biens_immobiliers").select("*").order("date_ajout", { ascending: false }).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeBiens");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p style=\"color:var(--texte-doux);\">Aucun bien pour le moment.</p>";
      return;
    }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var b = data[i];
      var image = (b.images && b.images[0]) ? b.images[0] : "";
      var actionVente = (b.statut === "vendu")
        ? "<span class=\"badge-vendu\">Deja vendu</span>"
        : "<button class=\"btn-action btn-vendu-action\" data-id=\"" + b.id + "\">Marquer vendu</button>";
      html += "<div class=\"bien-carte\">" +
                "<img src=\"" + escapeHtml(image) + "\" alt=\"\">" +
                "<div class=\"bien-info\">" +
                  "<h3>" + escapeHtml(b.titre) + "</h3>" +
                  "<p>" + Number(b.prix).toLocaleString("fr-FR") + " FCFA - " + escapeHtml(b.localisation) + "</p>" +
                  "<div class=\"boutons-bien\">" +
                    actionVente +
                    "<button class=\"btn-action btn-suppr btn-suppr-action\" data-id=\"" + b.id + "\">Supprimer</button>" +
                  "</div>" +
                "</div>" +
              "</div>";
    }
    zone.innerHTML = html;

    var boutonsVendu = document.getElementsByClassName("btn-vendu-action");
    for (var j = 0; j < boutonsVendu.length; j++) {
      boutonsVendu[j].addEventListener("click", function(e) {
        marquerVendu(e.target.getAttribute("data-id"));
      });
    }
    var boutonsSuppr = document.getElementsByClassName("btn-suppr-action");
    for (var k = 0; k < boutonsSuppr.length; k++) {
      boutonsSuppr[k].addEventListener("click", function(e) {
        supprimerBien(e.target.getAttribute("data-id"));
      });
    }
  });
}

function marquerVendu(id) {
  sb.from("biens_immobiliers").update({ statut: "vendu", date_vente: new Date().toISOString() }).eq("id", id).then(function() {
    chargerCompteur();
    chargerBiens();
  });
}

function supprimerBien(id) {
  if (!confirm("Supprimer definitivement ce bien ?")) return;
  sb.from("biens_immobiliers").delete().eq("id", id).then(function() {
    chargerCompteur();
    chargerBiens();
  });
}

function ajouterBien(event) {
  event.preventDefault();
  var btn = document.getElementById("btn_bien");
  var zoneMsg = document.getElementById("zoneMessage");
  btn.disabled = true;
  btn.textContent = "Publication en cours...";
  zoneMsg.innerHTML = "";

  var titre = document.getElementById("b_titre").value;
  var description = document.getElementById("b_description").value;
  var prix = document.getElementById("b_prix").value;
  var type_bien = document.getElementById("b_type").value;
  var localisation = document.getElementById("b_localisation").value;
  var fichiers = document.getElementById("b_images").files;
  var urls = [];
  var compteur = 0;
  var total = fichiers.length;

  if (total === 0) {
    finaliserAjout();
    return;
  }

  for (var i = 0; i < total; i++) {
    (function(fichier, index) {
      var nomFichier = nomFichierSur("bien", fichier, index);
      sb.storage.from("immobilier").upload(nomFichier, fichier).then(function(reponseUpload) {
        if (!reponseUpload.error) {
          var urlData = sb.storage.from("immobilier").getPublicUrl(nomFichier);
          urls.push(urlData.data.publicUrl);
        }
        compteur++;
        if (compteur === total) finaliserAjout();
      });
    })(fichiers[i], i);
  }

  function finaliserAjout() {
    sb.from("biens_immobiliers").insert([{
      titre: titre,
      description: description,
      prix: prix,
      type_bien: type_bien,
      localisation: localisation,
      images: urls
    }]).then(function(reponse) {
      btn.disabled = false;
      btn.textContent = "Publier le bien";
      if (reponse.error) {
        zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur : " + escapeHtml(reponse.error.message) + "</div>";
        return;
      }
      zoneMsg.innerHTML = "<div class=\"msg succes\">Bien publie avec succes !</div>";
      document.getElementById("formBien").reset();
      chargerBiens();
    });
  }
}

/* ================= LOCATIONS ================= */

function afficherChampChambres() {
  var parChambre = document.getElementById("l_mode").value === "chambre";
  document.getElementById("zoneNbChambres").style.display = parChambre ? "block" : "none";
  document.getElementById("labelPrixNuit").textContent = parChambre ? "Prix par chambre et par nuit (FCFA)" : "Prix par nuit (FCFA)";
}

function ajouterLogement(event) {
  event.preventDefault();
  var btn = document.getElementById("btn_logement");
  var zoneMsg = document.getElementById("zoneMessageLogement");
  zoneMsg.innerHTML = "";

  var mode = document.getElementById("l_mode").value;
  var prix = parseInt(document.getElementById("l_prix").value, 10);
  var nbChambres = mode === "chambre" ? parseInt(document.getElementById("l_nb_chambres").value, 10) : 1;
  var capaciteBrute = document.getElementById("l_capacite").value;
  var fichier = document.getElementById("l_photo").files[0];

  if (!prix || prix < 1) {
    zoneMsg.innerHTML = "<div class=\"msg erreur\">Indiquez un prix par nuit valide.</div>";
    return;
  }
  if (!nbChambres || nbChambres < 1 || nbChambres > 200) {
    zoneMsg.innerHTML = "<div class=\"msg erreur\">Nombre de chambres invalide (1 a 200).</div>";
    return;
  }
  if (!fichier) {
    zoneMsg.innerHTML = "<div class=\"msg erreur\">Ajoutez une photo du logement.</div>";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Publication en cours...";

  var nomFichier = nomFichierSur("logement", fichier, 0);
  sb.storage.from("immobilier").upload(nomFichier, fichier).then(function(reponseUpload) {
    if (reponseUpload.error) {
      btn.disabled = false;
      btn.textContent = "Publier le logement";
      zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur lors de l'envoi de la photo : " + escapeHtml(reponseUpload.error.message) + "</div>";
      return;
    }
    var urlPhoto = sb.storage.from("immobilier").getPublicUrl(nomFichier).data.publicUrl;

    sb.from("logements_location").insert([{
      titre: document.getElementById("l_titre").value.trim(),
      type: document.getElementById("l_type").value,
      mode_location: mode,
      nb_chambres: nbChambres,
      prix_nuit: prix,
      capacite_personnes: capaciteBrute ? parseInt(capaciteBrute, 10) : null,
      localisation: document.getElementById("l_localisation").value.trim(),
      equipements: document.getElementById("l_equipements").value.trim() || null,
      description: document.getElementById("l_description").value.trim() || null,
      photo_url: urlPhoto
    }]).then(function(reponse) {
      btn.disabled = false;
      btn.textContent = "Publier le logement";
      if (reponse.error) {
        zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur : " + escapeHtml(reponse.error.message) + "</div>";
        return;
      }
      zoneMsg.innerHTML = "<div class=\"msg succes\">Logement publie avec succes !</div>";
      document.getElementById("formLogement").reset();
      afficherChampChambres();
      chargerLogements();
    });
  });
}

    lierBoutons("btn-retirer-logement", retirerLogement);

function lierBoutons(classe, action) {
  var boutons = document.getElementsByClassName(classe);
  for (var i = 0; i < boutons.length; i++) {
    boutons[i].addEventListener("click", function(e) {
      action(e.target.getAttribute("data-id"));
    });
  }
}

function changerSuspension(id, suspendre) {
  var question = suspendre
    ? "Suspendre la location de ce logement ? Les clients ne pourront plus le reserver (les reservations deja faites sont conservees)."
    : "Reactiver la location de ce logement ?";
  if (!confirm(question)) return;
  sb.from("logements_location").update({ suspendu: suspendre }).eq("id", id).then(function(reponse) {
    if (reponse.error) alert("Erreur : " + reponse.error.message);
    chargerLogements();
  });
}

function retirerLogement(id) {
  if (!confirm("Retirer ce logement du site ? Il ne sera plus visible ni reservable. L'historique des reservations est conserve.")) return;
  sb.from("logements_location").update({ actif: false }).eq("id", id).then(function(reponse) {
    if (reponse.error) alert("Erreur : " + reponse.error.message);
    chargerLogements();
  });
}

function chargerReservationsLogement() {
  sb.from("reservations_logement")
    .select("*, logements_location(titre, mode_location)")
    .order("date_arrivee", { ascending: false })
    .limit(60)
    .then(function(reponse) {
      var data = reponse.data;
      var zone = document.getElementById("listeReservationsLogement");
      if (reponse.error) {
        zone.innerHTML = "<p style=\"color:var(--alerte);\">Erreur de chargement : " + escapeHtml(reponse.error.message) + "</p>";
        return;
      }
      if (!data || data.length === 0) {
        zone.innerHTML = "<p style=\"color:var(--texte-doux);\">Aucune reservation pour le moment.</p>";
        return;
      }
      var maintenant = Date.now();
      var html = "";
      for (var i = 0; i < data.length; i++) {
        var r = data[i];
        var logement = r.logements_location || {};
        var expiree = r.statut === "en_attente" && r.statut_paiement !== "paye" && (maintenant - new Date(r.date_creation).getTime()) > 30 * 60000;
        var badge;
        if (r.statut === "annulee") badge = "<span class=\"badge badge-gris\">Annulee</span>";
        else if (r.statut === "confirmee") badge = "<span class=\"badge badge-vert\">Confirmee - payee</span>";
        else if (expiree) badge = "<span class=\"badge badge-gris\">Non payee - expiree</span>";
        else badge = "<span class=\"badge badge-orange\">En attente de paiement</span>";

        var tel = String(r.client_telephone || "").replace(/[^0-9+]/g, "");
        html += "<div class=\"resa-carte\">" +
                  "<h3>" + escapeHtml(logement.titre || "Logement") + "</h3>" +
                  "<div>Du " + dateCourte(r.date_arrivee) + " au " + dateCourte(r.date_depart) + " (" + r.nb_nuits + " nuit" + (r.nb_nuits > 1 ? "s" : "") + ")" +
                    (logement.mode_location === "chambre" ? " - " + r.nb_chambres + " chambre" + (r.nb_chambres > 1 ? "s" : "") : "") + "</div>" +
                  "<div>Client : " + escapeHtml(r.client_nom) + (tel ? " - <a href=\"tel:" + tel + "\">" + escapeHtml(r.client_telephone) + "</a>" : "") + "</div>" +
                  "<div style=\"color:var(--accent);font-weight:700;margin-top:4px;\">" + Number(r.prix_total || 0).toLocaleString("fr-FR") + " FCFA</div>" +
                  badge +
                  (r.statut !== "annulee"
                    ? "<div class=\"boutons-bien\"><button class=\"btn-action btn-suppr btn-annuler-resa-logement\" data-id=\"" + r.id + "\">Annuler cette reservation</button></div>"
                    : "") +
                "</div>";
      }
      zone.innerHTML = html;
      lierBoutons("btn-annuler-resa-logement", annulerReservationLogement);
    });
}

function annulerReservationLogement(id) {
  if (!confirm("Annuler cette reservation ? Les dates seront liberees. Si le client a deja paye, pensez a le rembourser vous-meme.")) return;
  sb.from("reservations_logement").update({ statut: "annulee" }).eq("id", id).then(function(reponse) {
    if (reponse.error) alert("Erreur : " + reponse.error.message);
    chargerReservationsLogement();
  });
}

verifierEtCharger();
</script>
