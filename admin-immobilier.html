<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Gestion Immobilier</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background-color: #0a0e17; color: #ffffff; }
  header { background-color: #0d1220; padding: 20px; text-align: center; border-bottom: 2px solid #d62828; }
  header h1 { color: #1e6fd9; font-size: 20px; }
  .back { display: inline-block; margin: 15px; color: #b0b8c5; text-decoration: none; font-size: 14px; }
  .content { padding: 15px; max-width: 500px; margin: 0 auto; }
  .stat-carte { background-color: #121826; border: 1px solid #d62828; border-radius: 10px; padding: 18px; text-align: center; margin-bottom: 20px; }
  .stat-carte .chiffre { color: #d62828; font-size: 28px; font-weight: bold; }
  .stat-carte .label { color: #b0b8c5; font-size: 13px; margin-top: 4px; }
  .carte { background-color: #121826; border: 1px solid #1e6fd9; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .carte h2 { font-size: 16px; margin-bottom: 12px; color: #1e6fd9; }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 14px; color: #b0b8c5; }
  input, select, textarea { background-color: #0a0e17; border: 1px solid #2a3040; border-radius: 6px; padding: 10px; color: #ffffff; font-size: 14px; font-family: Arial, sans-serif; }
  button { background-color: #1e6fd9; color: #ffffff; border: none; border-radius: 6px; padding: 14px; font-size: 15px; font-weight: bold; margin-top: 8px; }
  button:disabled { opacity: 0.6; }
  .msg { font-size: 14px; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
  .msg.erreur { background-color: #3a1414; color: #ff8080; }
  .msg.succes { background-color: #143a1e; color: #80ff9e; }
  .bien-carte { display: flex; gap: 10px; background-color: #0a0e17; border: 1px solid #2a3040; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .bien-carte img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; }
  .bien-info h3 { font-size: 14px; }
  .bien-info p { font-size: 12px; color: #b0b8c5; margin-top: 2px; }
  .btn-vendu { background-color: transparent; border: 1px solid #d62828; color: #d62828; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-top: 6px; }
  .badge-vendu { background-color: #3a1414; color: #ff8080; font-size: 11px; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 4px; }
  .chargement { text-align: center; padding: 30px; color: #b0b8c5; }
</style>
</head>
<body>

<header>
  <h1>Gestion Immobilier</h1>
</header>

<a href="admin-espace.html" class="back">&#8592; Retour à l'administration</a>

<div class="content">
  <div id="zoneContenu" class="chargement">Vérification des droits...</div>
</div>

<script>
const sb = supabase.createClient(
  'https://vnceunqygoiwglnwpgcr.supabase.co',
  'sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK'
);

async function verifierEtCharger() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { window.location.href = 'admin-connexion.html'; return; }

  const { data: admin } = await sb.from('admins').select('*').eq('user_id', user.id).single();
  var zone = document.getElementById('zoneContenu');

  if (!admin) {
    zone.innerHTML = '<div class="carte"><p>Accès refusé.</p></div>';
    return;
  }

  zone.innerHTML = `
    <div class="stat-carte">
      <div class="chiffre" id="compteurVendus">...</div>
      <div class="label">biens vendus sur la plateforme</div>
    </div>

    <div class="carte">
      <h2>Ajouter un bien</h2>
      <div id="zoneMessage"></div>
      <form id="formBien" onsubmit="ajouterBien(event)">
        <label>Titre</label>
        <input type="text" id="b_titre" placeholder="Ex : Terrain 300m² Doumga" required>

        <label>Description</label>
        <textarea id="b_description" rows="3" placeholder="Décrivez le bien"></textarea>

        <label>Prix (FCFA)</label>
        <input type="number" id="b_prix" placeholder="Ex : 5000000" required>

        <label>Type de bien</label>
        <select id="b_type" required>
          <option value="">Choisir...</option>
          <option value="Terrain">Terrain</option>
          <option value="Maison">Maison</option>
          <option value="Appartement">Appartement</option>
          <option value="Local commercial">Local commercial</option>
        </select>

        <label>Localisation</label>
        <input type="text" id="b_localisation" placeholder="Ville / quartier" required>

        <label>Photos (plusieurs possibles)</label>
        <input type="file" id="b_images" accept="image/*" multiple required>

        <button type="submit" id="btn_bien">Publier le bien</button>
      </form>
    </div>

    <div class="carte">
      <h2>Biens publiés</h2>
      <div id="listeBiens"><p class="label">Chargement...</p></div>
    </div>
  `;

  chargerCompteur();
  chargerBiens();
}

async function chargerCompteur() {
  const { count } = await sb.from('biens_immobiliers').select('*', { count: 'exact', head: true }).eq('statut', 'vendu');
  document.getElementById('compteurVendus').textContent = count || 0;
}

async function chargerBiens() {
  const { data } = await sb.from('biens_immobiliers').select('*').order('date_ajout', { ascending: false });
  var zone = document.getElementById('listeBiens');
  if (!data || data.length === 0) { zone.innerHTML = '<p class="label">Aucun bien pour le moment.</p>'; return; }
  zone.innerHTML = data.map(b => `
    <div class="bien-carte">
      <img src="${(b.images && b.images[0]) || ''}" alt="${b.titre}">
      <div class="bien-info">
        <h3>${b.titre}</h3>
        <p>${b.prix} FCFA — ${b.localisation}</p>
        ${b.statut === 'vendu' ? '<span class="badge-vendu">Déjà vendu</span>' : `<button class="btn-vendu" onclick="marquerVendu('${b.id}')">Marquer vendu</button>`}
      </div>
    </div>
  `).join('');
}

async function marquerVendu(id) {
  await sb.from('biens_immobiliers').update({ statut: 'vendu', date_vente: new Date().toISOString() }).eq('id', id);
  chargerCompteur();
  chargerBiens();
}

async function ajouterBien(event) {
  event.preventDefault();
  var btn = document.getElementById('btn_bien');
  var zoneMsg = document.getElementById('zoneMessage');
  btn.disabled = true;
  btn.textContent = 'Publication en cours...';
  zoneMsg.innerHTML = '';

  var titre = document.getElementById('b_titre').value;
  var description = document.getElementById('b_description').value;
  var prix = document.getElementById('b_prix').value;
  var type_bien = document.getElementById('b_type').value;
  var localisation = document.getElementById('b_localisation').value;
  var fichiers = document.getElementById('b_images').files;

  var urls = [];
  for (var i = 0; i < fichiers.length; i++) {
    var nomFichier = 'bien_' + Date.now() + '_' + i + '_' + fichiers[i].name;
    const { error: erreurUpload } = await sb.storage.from('immobilier').upload(nomFichier, fichiers[i]);
    if (!erreurUpload) {
      const { data: urlData } = sb.storage.from('immobilier').getPublicUrl(nomFichier);
      urls.push(urlData.publicUrl);
    }
  }

  const { error } = await sb.from('biens_immobiliers').insert([{
    titre: titre,
    description: description,
    prix: prix,
    type_bien: type_bien,
    localisation: localisation,
    images: urls
  }]);

  btn.disabled = false;
  btn.textContent = 'Publier le bien';

  if (error) {
    zoneMsg.innerHTML = '<div class="msg erreur">Erreur : ' + error.message + '</div>';
    return;
  }

  zoneMsg.innerHTML = '<div class="msg succes">Bien publié avec succès !</div>';
  document.getElementById('formBien').reset();
  chargerBiens();
}

verifierEtCharger();
</script>

</body>
</html>
