<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Gestion Immobilier</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background-color: #0a0e17; color: #ffffff; }
  header { background-color: #0d1220; padding: 20px; text-align: center; border-bottom: 2px solid #d62828; }
  header h1 { color: #1e6fd9; font-size: 20px; }
  .back { display: inline-block; margin: 15px; color: #b0b8c5; text-decoration: none; font-size: 14px; }
  .content { padding: 15px; max-width: 500px; margin: 0 auto; }
  .stat-carte { background-color: #121826; border: 1px solid #d62828; border-radius: 10px; padding: 18px; text-align: center; margin-bottom: 20px; }
  .stat-carte .chiffre { color: #d62828; font-size: 28px; font-weight: bold; }
  .stat-carte .label { color: #b0b8c5; font-size: 13px; margin-top: 4px; }
  .carte { background-color: #121826; border: 1px solid #1e6fd9; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .carte h2 { font-size: 16px; margin-bottom: 12px; color: #1e6fd9; }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 14px; color: #b0b8c5; }
  input, select, textarea { background-color: #0a0e17; border: 1px solid #2a3040; border-radius: 6px; padding: 10px; color: #ffffff; font-size: 14px; font-family: Arial, sans-serif; }
  button { background-color: #1e6fd9; color: #ffffff; border: none; border-radius: 6px; padding: 14px; font-size: 15px; font-weight: bold; margin-top: 8px; }
  button:disabled { opacity: 0.6; }
  .msg { font-size: 14px; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
  .msg.erreur { background-color: #3a1414; color: #ff8080; }
  .msg.succes { background-color: #143a1e; color: #80ff9e; }
  .bien-carte { display: flex; gap: 10px; background-color: #0a0e17; border: 1px solid #2a3040; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .bien-carte img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; }
  .bien-info { flex: 1; }
  .bien-info h3 { font-size: 14px; }
  .bien-info p { font-size: 12px; color: #b0b8c5; margin-top: 2px; }
  .boutons-bien { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .btn-action { background-color: transparent; border: 1px solid #1e6fd9; color: #1e6fd9; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin: 0; }
  .btn-suppr { border-color: #d62828; color: #d62828; }
  .badge-vendu { background-color: #3a1414; color: #ff8080; font-size: 11px; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 4px; }
  .chargement { text-align: center; padding: 30px; color: #b0b8c5; }
</style>
</head>
<body>

<header>
  <h1>Gestion Immobilier</h1>
</header>

<a href="admin-espace.html" class="back">&#8592; Retour a l administration</a>

<div class="content">
  <div id="zoneContenu" class="chargement">Verification des droits...</div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

function verifierEtCharger() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "admin-connexion.html";
      return;
    }
    sb.from("admins").select("*").eq("user_id", user.id).single().then(function(reponseAdmin) {
      var admin = reponseAdmin.data;
      var zone = document.getElementById("zoneContenu");
      if (!admin) {
        zone.innerHTML = "<div class=\"carte\"><p>Acces refuse.</p></div>";
        return;
      }
      zone.innerHTML =
        "<div class=\"stat-carte\">" +
          "<div class=\"chiffre\" id=\"compteurVendus\">...</div>" +
          "<div class=\"label\">biens vendus sur la plateforme</div>" +
        "</div>" +
        "<div class=\"carte\">" +
          "<h2>Ajouter un bien</h2>" +
          "<div id=\"zoneMessage\"></div>" +
          "<form id=\"formBien\">" +
            "<label>Titre</label>" +
            "<input type=\"text\" id=\"b_titre\" placeholder=\"Ex : Terrain 300m2 Doumga\" required>" +
            "<label>Description</label>" +
            "<textarea id=\"b_description\" rows=\"3\" placeholder=\"Decrivez le bien\"></textarea>" +
            "<label>Prix (FCFA)</label>" +
            "<input type=\"number\" id=\"b_prix\" placeholder=\"Ex : 5000000\" required>" +
            "<label>Type de bien</label>" +
            "<select id=\"b_type\" required>" +
              "<option value=\"\">Choisir...</option>" +
              "<option value=\"Terrain\">Terrain</option>" +
              "<option value=\"Maison\">Maison</option>" +
              "<option value=\"Appartement\">Appartement</option>" +
              "<option value=\"Local commercial\">Local commercial</option>" +
            "</select>" +
            "<label>Localisation</label>" +
            "<input type=\"text\" id=\"b_localisation\" placeholder=\"Ville / quartier\" required>" +
            "<label>Photos (plusieurs possibles)</label>" +
            "<input type=\"file\" id=\"b_images\" accept=\"image/*\" multiple required>" +
            "<button type=\"submit\" id=\"btn_bien\">Publier le bien</button>" +
          "</form>" +
        "</div>" +
        "<div class=\"carte\">" +
          "<h2>Biens publies</h2>" +
          "<div id=\"listeBiens\"><p class=\"label\">Chargement...</p></div>" +
        "</div>";

      document.getElementById("formBien").addEventListener("submit", ajouterBien);
      chargerCompteur();
      chargerBiens();
    });
  });
}

function chargerCompteur() {
  sb.from("biens_immobiliers").select("*", { count: "exact", head: true }).eq("statut", "vendu").then(function(reponse) {
    document.getElementById("compteurVendus").textContent = reponse.count || 0;
  });
}

function chargerBiens() {
  sb.from("biens_immobiliers").select("*").order("date_ajout", { ascending: false }).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeBiens");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p class=\"label\">Aucun bien pour le moment.</p>";
      return;
    }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var b = data[i];
      var image = (b.images && b.images[0]) ? b.images[0] : "";
      var actionVente = (b.statut === "vendu")
        ? "<span class=\"badge-vendu\">Deja vendu</span>"
        : "<button class=\"btn-action btn-vendu-action\" data-id=\"" + b.id + "\">Marquer vendu</button>";
      html += "<div class=\"bien-carte\">" +
                "<img src=\"" + image + "\" alt=\"\">" +
                "<div class=\"bien-info\">" +
                  "<h3>" + b.titre + "</h3>" +
                  "<p>" + Number(b.prix).toLocaleString("fr-FR") + " FCFA - " + b.localisation + "</p>" +
                  "<div class=\"boutons-bien\">" +
                    actionVente +
                    "<button class=\"btn-action btn-suppr btn-suppr-action\" data-id=\"" + b.id + "\">Supprimer</button>" +
                  "</div>" +
                "</div>" +
              "</div>";
    }
    zone.innerHTML = html;

    var boutonsVendu = document.getElementsByClassName("btn-vendu-action");
    for (var j = 0; j < boutonsVendu.length; j++) {
      boutonsVendu[j].addEventListener("click", function(e) {
        marquerVendu(e.target.getAttribute("data-id"));
      });
    }
    var boutonsSuppr = document.getElementsByClassName("btn-suppr-action");
    for (var k = 0; k < boutonsSuppr.length; k++) {
      boutonsSuppr[k].addEventListener("click", function(e) {
        supprimerBien(e.target.getAttribute("data-id"));
      });
    }
  });
}

function marquerVendu(id) {
  sb.from("biens_immobiliers").update({ statut: "vendu", date_vente: new Date().toISOString() }).eq("id", id).then(function() {
    chargerCompteur();
    chargerBiens();
  });
}

function supprimerBien(id) {
  if (!confirm("Supprimer definitivement ce bien ?")) return;
  sb.from("biens_immobiliers").delete().eq("id", id).then(function() {
    chargerCompteur();
    chargerBiens();
  });
}

function ajouterBien(event) {
  event.preventDefault();
  var btn = document.getElementById("btn_bien");
  var zoneMsg = document.getElementById("zoneMessage");
  btn.disabled = true;
  btn.textContent = "Publication en cours...";
  zoneMsg.innerHTML = "";

  var titre = document.getElementById("b_titre").value;
  var description = document.getElementById("b_description").value;
  var prix = document.getElementById("b_prix").value;
  var type_bien = document.getElementById("b_type").value;
  var localisation = document.getElementById("b_localisation").value;
  var fichiers = document.getElementById("b_images").files;
  var urls = [];
  var compteur = 0;
  var total = fichiers.length;

  if (total === 0) {
    finaliserAjout();
    return;
  }

  for (var i = 0; i < total; i++) {
    (function(fichier, index) {
      var nomFichier = "bien_" + Date.now() + "_" + index + "_" + fichier.name;
      sb.storage.from("immobilier").upload(nomFichier, fichier).then(function(reponseUpload) {
        if (!reponseUpload.error) {
          var urlData = sb.storage.from("immobilier").getPublicUrl(nomFichier);
          urls.push(urlData.data.publicUrl);
        }
        compteur++;
        if (compteur === total) finaliserAjout();
      });
    })(fichiers[i], i);
  }

  function finaliserAjout() {
    sb.from("biens_immobiliers").insert([{
      titre: titre,
      description: description,
      prix: prix,
      type_bien: type_bien,
      localisation: localisation,
      images: urls
    }]).then(function(reponse) {
      btn.disabled = false;
      btn.textContent = "Publier le bien";
      if (reponse.error) {
        zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + "</div>";
        return;
      }
      zoneMsg.innerHTML = "<div class=\"msg succes\">Bien publie avec succes !</div>";
      document.getElementById("formBien").reset();
      chargerBiens();
    });
  }
}

verifierEtCharger();
</script>

</body>
</html>
