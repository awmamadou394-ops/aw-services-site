<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Mon Espace Vendeur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background-color: #0a0e17; color: #ffffff; }
  header { background-color: #0d1220; padding: 20px; text-align: center; border-bottom: 2px solid #d62828; display: flex; justify-content: space-between; align-items: center; }
  header h1 { color: #1e6fd9; font-size: 18px; }
  .deconnexion { background-color: transparent; border: 1px solid #d62828; color: #d62828; padding: 8px 14px; border-radius: 6px; font-size: 13px; }
  .content { padding: 20px 15px; max-width: 500px; margin: 0 auto; }
  .carte { background-color: #121826; border: 1px solid #1e6fd9; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
  .carte h2 { font-size: 16px; margin-bottom: 10px; }
  .statut { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
  .statut.en_attente { background-color: #3a2e14; color: #ffb84d; }
  .statut.approuve { background-color: #143a1e; color: #80ff9e; }
  .info { color: #b0b8c5; font-size: 14px; margin-top: 6px; }
  .chargement { text-align: center; padding: 40px; color: #b0b8c5; }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 14px; color: #b0b8c5; }
  input, textarea { background-color: #0a0e17; border: 1px solid #2a3040; border-radius: 6px; padding: 10px; color: #ffffff; font-size: 14px; font-family: Arial, sans-serif; }
  button { background-color: #1e6fd9; color: #ffffff; border: none; border-radius: 6px; padding: 14px; font-size: 16px; font-weight: bold; margin-top: 10px; }
  button:disabled { opacity: 0.6; }
  .msg { font-size: 14px; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
  .msg.erreur { background-color: #3a1414; color: #ff8080; }
  .msg.succes { background-color: #143a1e; color: #80ff9e; }
  .produit-carte { display: flex; gap: 12px; background-color: #121826; border: 1px solid #2a3040; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .produit-carte img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background-color: #0a0e17; }
  .produit-info h3 { font-size: 15px; }
  .produit-info p { font-size: 13px; color: #b0b8c5; margin-top: 3px; }
</style>
</head>
<body>

<header>
  <h1>Mon Espace Vendeur</h1>
  <button class="deconnexion" id="btnDeconnexion">Deconnexion</button>
</header>

<div class="content">
  <div id="zoneContenu" class="chargement">Chargement...</div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

var vendeurCourant = null;

document.getElementById("btnDeconnexion").addEventListener("click", function() {
  sb.auth.signOut().then(function() {
    window.location.href = "vendeur-connexion.html";
  });
});

function chargerEspace() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "vendeur-connexion.html";
      return;
    }
    sb.from("vendeurs").select("*").eq("user_id", user.id).single().then(function(reponse) {
      var vendeur = reponse.data;
      var zone = document.getElementById("zoneContenu");
      if (reponse.error || !vendeur) {
        zone.innerHTML = "<div class=\"carte\"><p class=\"info\">Profil introuvable. Contactez AW SERVICES.</p></div>";
        return;
      }
      vendeurCourant = vendeur;
      var statutLabel = vendeur.statut === "approuve" ? "Approuve" : "En attente de validation";
      var positionLabel = (vendeur.latitude && vendeur.longitude) ? "Position enregistree" : "Position non enregistree";

      zone.innerHTML =
        "<div class=\"carte\">" +
          "<h2>Bienvenue, " + vendeur.nom + "</h2>" +
          "<span class=\"statut " + vendeur.statut + "\">" + statutLabel + "</span>" +
          "<p class=\"info\">Telephone : " + vendeur.telephone + "</p>" +
          "<p class=\"info\">Produits : " + vendeur.produits_categorie + "</p>" +
        "</div>" +

        "<div class=\"carte\">" +
          "<h2>Localisation de ma boutique</h2>" +
          "<p class=\"info\" id=\"statutPosition\">" + positionLabel + "</p>" +
          "<div id=\"zoneMessagePosition\"></div>" +
          "<button id=\"btnPosition\">Enregistrer ma position actuelle</button>" +
        "</div>" +

        "<div class=\"carte\">" +
          "<h2>Ajouter un produit</h2>" +
          "<div id=\"zoneMessageProduit\"></div>" +
          "<form id=\"formProduit\">" +
            "<label>Nom du produit</label>" +
            "<input type=\"text\" id=\"p_nom\" placeholder=\"Ex : Casque Bluetooth\" required>" +
            "<label>Description</label>" +
            "<textarea id=\"p_description\" rows=\"3\" placeholder=\"Decrivez votre produit\"></textarea>" +
            "<label>Prix (FCFA)</label>" +
            "<input type=\"number\" id=\"p_prix\" placeholder=\"Ex : 15000\" required>" +
            "<label>Categorie</label>" +
            "<input type=\"text\" id=\"p_categorie\" placeholder=\"Ex : Electronique\" required>" +
            "<label>Quantite en stock</label>" +
            "<input type=\"number\" id=\"p_stock\" placeholder=\"Ex : 10\" required>" +
            "<label>Photo du produit</label>" +
            "<input type=\"file\" id=\"p_photo\" accept=\"image/*\" required>" +
            "<button type=\"submit\" id=\"btn_produit\">Publier le produit</button>" +
          "</form>" +
        "</div>" +

        "<div class=\"carte\">" +
          "<h2>Mes produits</h2>" +
          "<div id=\"listeProduits\"><p class=\"info\">Chargement...</p></div>" +
        "</div>";

      document.getElementById("btnPosition").addEventListener("click", enregistrerPosition);
      document.getElementById("formProduit").addEventListener("submit", ajouterProduit);
      chargerProduits();
    });
  });
}

function enregistrerPosition() {
  var btn = document.getElementById("btnPosition");
  var zoneMsg = document.getElementById("zoneMessagePosition");

  if (!navigator.geolocation) {
    zoneMsg.innerHTML = "<div class=\"msg erreur\">La geolocalisation n'est pas disponible sur cet appareil.</div>";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Localisation en cours...";
  zoneMsg.innerHTML = "";

  navigator.geolocation.getCurrentPosition(function(position) {
    var lat = position.coords.latitude;
    var lng = position.coords.longitude;

    sb.from("vendeurs").update({ latitude: lat, longitude: lng }).eq("id", vendeurCourant.id).then(function(reponse) {
      btn.disabled = false;
      btn.textContent = "Enregistrer ma position actuelle";
      if (reponse.error) {
        zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + "</div>";
        return;
      }
      document.getElementById("statutPosition").textContent = "Position enregistree";
      zoneMsg.innerHTML = "<div class=\"msg succes\">Position enregistree avec succes !</div>";
    });
  }, function(erreur) {
    btn.disabled = false;
    btn.textContent = "Enregistrer ma position actuelle";
    zoneMsg.innerHTML = "<div class=\"msg erreur\">Impossible d'obtenir votre position. Verifiez que la localisation est activee.</div>";
  });
}

function chargerProduits() {
  sb.from("produits").select("*").eq("vendeur_id", vendeurCourant.id).order("date_ajout", { ascending: false }).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeProduits");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p class=\"info\">Aucun produit publie pour le moment.</p>";
      return;
    }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var p = data[i];
      html += "<div class=\"produit-carte\">" +
                "<img src=\"" + (p.image_url || "") + "\" alt=\"\">" +
                "<div class=\"produit-info\">" +
                  "<h3>" + p.nom + "</h3>" +
                  "<p>" + p.prix + " FCFA - Stock : " + p.stock + "</p>" +
                  "<p>" + (p.statut === "approuve" ? "Visible sur le site" : "En attente de validation") + "</p>" +
                "</div>" +
              "</div>";
    }
    zone.innerHTML = html;
  });
}

function ajouterProduit(event) {
  event.preventDefault();
  var btn = document.getElementById("btn_produit");
  var zoneMsg = document.getElementById("zoneMessageProduit");
  btn.disabled = true;
  btn.textContent = "Publication en cours...";
  zoneMsg.innerHTML = "";

  var nom = document.getElementById("p_nom").value;
  var description = document.getElementById("p_description").value;
  var prix = document.getElementById("p_prix").value;
  var categorie = document.getElementById("p_categorie").value;
  var stock = document.getElementById("p_stock").value;
  var fichier = document.getElementById("p_photo").files[0];
  var nomFichier = vendeurCourant.id + "_" + Date.now() + "_" + fichier.name;

  sb.storage.from("produits").upload(nomFichier, fichier).then(function(reponseUpload) {
    if (reponseUpload.error) {
      zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur photo : " + reponseUpload.error.message + "</div>";
      btn.disabled = false;
      btn.textContent = "Publier le produit";
      return;
    }
    var urlData = sb.storage.from("produits").getPublicUrl(nomFichier);
    sb.from("produits").insert([{
      vendeur_id: vendeurCourant.id,
      nom: nom,
      description: description,
      prix: prix,
      categorie: categorie,
      stock: stock,
      image_url: urlData.data.publicUrl
    }]).then(function(reponse) {
      btn.disabled = false;
      btn.textContent = "Publier le produit";
      if (reponse.error) {
        zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + "</div>";
        return;
      }
      zoneMsg.innerHTML = "<div class=\"msg succes\">Produit publie ! En attente de validation par AW SERVICES.</div>";
      document.getElementById("formProduit").reset();
      chargerProduits();
    });
  });
}

chargerEspace();
</script>

</body>
</html>
