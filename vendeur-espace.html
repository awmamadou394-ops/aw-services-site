<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Mon Espace Vendeur</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .aw-header { display: flex; justify-content: space-between; align-items: center; text-align: left; }
  .aw-header h1 { font-size: 18px; }
  .deconnexion { background-color: transparent; border: 1px solid var(--alerte); color: var(--alerte); padding: 8px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 600; font-family: var(--police-texte); }
  .chargement { text-align: center; padding: 40px; color: var(--texte-doux); }

  .msg-notif { font-size: 12px; margin-top: 8px; color: var(--texte-doux); }
  .msg-notif.ok { color: var(--succes); }
  .msg-notif.err { color: var(--alerte); }

  .produit-carte { display: flex; gap: 12px; background-color: var(--fond); border: 1px solid var(--bordure); border-radius: var(--rayon); padding: 12px; margin-bottom: 10px; }
  .produit-carte img { width: 70px; height: 70px; border-radius: var(--rayon-petit); object-fit: cover; background-color: var(--surface); }
  .produit-info h3 { font-size: 15px; font-family: var(--police-titre); }
  .produit-info p { font-size: 13px; color: var(--texte-doux); margin-top: 3px; }
  .produit-info .prix-p { color: var(--accent); font-family: var(--police-chiffres); font-weight: 700; }

  .commande-carte { background-color: var(--fond); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 12px; margin-bottom: 10px; }
  .commande-carte h3 { font-size: 14px; font-family: var(--police-titre); }
  .commande-carte p { font-size: 13px; color: var(--texte-doux); margin-top: 3px; }
  .date-commande { font-size: 11px; color: var(--texte-discret); margin-bottom: 4px; }
  .badge-statut { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-top: 6px; margin-right: 5px; }
  .badge-nouvelle { background-color: rgba(242,169,59,0.15); color: var(--accent); }
  .badge-en_preparation { background-color: rgba(107,169,255,0.15); color: #6aa9ff; }
  .badge-prete { background-color: rgba(63,163,77,0.15); color: var(--succes); }
  .badge-liv { background-color: rgba(192,140,255,0.15); color: #c08cff; }
  .msg { font-size: 13px; padding: 10px; border-radius: var(--rayon-petit); margin-top: 8px; }
  .msg.erreur { background-color: rgba(232,72,58,0.12); color: var(--alerte); }
  .msg.succes { background-color: rgba(63,163,77,0.12); color: var(--succes); }
</style>
</head>
<body>

<header class="aw-header">
  <h1>Mon Espace Vendeur</h1>
  <button class="deconnexion" id="btnDeconnexion">Deconnexion</button>
</header>

<div class="aw-conteneur">
  <div id="zoneContenu" class="chargement">Chargement...</div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

var VAPID_PUBLIC_KEY = "BJw5df2L2JS-HB2BoXP7QNx1caYe4F1PaLbXy6kY1KI7SY9Evt5GjH19HsacU1iT9547pf6sjUeVsThHd8mOkr0";
var vendeurCourant = null;

var LIBELLES = {
  nouvelle: "Commande recue",
  en_preparation: "En preparation",
  prete: "Prete a recuperer"
};

var LIBELLES_LIV = {
  vers_boutique: "Livreur en route vers vous",
  en_livraison: "Recuperee par le livreur",
  livree: "Livree au client"
};

document.getElementById("btnDeconnexion").addEventListener("click", function() {
  sb.auth.signOut().then(function() {
    window.location.href = "vendeur-connexion.html";
  });
});

function chargerEspace() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "vendeur-connexion.html";
      return;
    }
    sb.from("vendeurs").select("*").eq("user_id", user.id).single().then(function(reponse) {
      var vendeur = reponse.data;
      var zone = document.getElementById("zoneContenu");
      if (reponse.error || !vendeur) {
        zone.innerHTML = "<div class=\"aw-carte\"><p>Profil introuvable. Contactez AW SERVICES.</p></div>";
        return;
      }
      vendeurCourant = vendeur;
      var statutLabel = vendeur.statut === "approuve" ? "Approuve" : "En attente de validation";
      var classeStatut = vendeur.statut === "approuve" ? "aw-badge-succes" : "aw-badge-attente";
      var positionLabel = (vendeur.latitude && vendeur.longitude) ? "Position enregistree" : "Position non enregistree";

      zone.innerHTML =
        "<div class=\"aw-carte\">" +
          "<p class=\"aw-section-titre\">Bienvenue, " + vendeur.nom + "</p>" +
          "<span class=\"aw-badge " + classeStatut + "\">" + statutLabel + "</span>" +
          "<p style=\"margin-top:10px;color:var(--texte-doux);font-size:14px;\">Telephone : " + vendeur.telephone + "</p>" +
          "<p style=\"color:var(--texte-doux);font-size:14px;\">Produits : " + vendeur.produits_categorie + "</p>" +
        "</div>" +

        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Notifications</p>" +
          "<p style=\"color:var(--texte-doux);font-size:13.5px;margin-bottom:10px;\">Soyez alerte des nouvelles commandes et de leur suivi.</p>" +
          "<button class=\"aw-btn aw-btn-primaire\" id=\"btnActiverNotif\" style=\"width:100%;\">Activer les notifications</button>" +
          "<p class=\"msg-notif\" id=\"msgNotif\"></p>" +
        "</div>" +

        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Commandes a traiter</p>" +
          "<div id=\"listeCommandes\"><p style=\"color:var(--texte-doux);\">Chargement...</p></div>" +
        "</div>" +

        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Localisation de ma boutique</p>" +
          "<p style=\"color:var(--texte-doux);font-size:13.5px;\" id=\"statutPosition\">" + positionLabel + "</p>" +
          "<div id=\"zoneMessagePosition\"></div>" +
          "<button class=\"aw-btn aw-btn-secondaire\" id=\"btnPosition\" style=\"width:100%;margin-top:10px;\">&#128205; Enregistrer ma position actuelle</button>" +
        "</div>" +

        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Ajouter un produit</p>" +
          "<div id=\"zoneMessageProduit\"></div>" +
          "<form id=\"formProduit\">" +
            "<label class=\"aw-label\">Nom du produit</label>" +
            "<input class=\"aw-input\" type=\"text\" id=\"p_nom\" placeholder=\"Ex : Casque Bluetooth\" required>" +
            "<label class=\"aw-label\">Description</label>" +
            "<textarea class=\"aw-textarea\" id=\"p_description\" rows=\"3\" placeholder=\"Decrivez votre produit\"></textarea>" +
            "<label class=\"aw-label\">Prix (FCFA)</label>" +
            "<input class=\"aw-input\" type=\"number\" id=\"p_prix\" placeholder=\"Ex : 15000\" required>" +
            "<label class=\"aw-label\">Categorie</label>" +
            "<input class=\"aw-input\" type=\"text\" id=\"p_categorie\" placeholder=\"Ex : Electronique\" required>" +
            "<label class=\"aw-label\">Quantite en stock</label>" +
            "<input class=\"aw-input\" type=\"number\" id=\"p_stock\" placeholder=\"Ex : 10\" required>" +
            "<label class=\"aw-label\">Photo du produit</label>" +
            "<input type=\"file\" id=\"p_photo\" accept=\"image/*\" required style=\"background-color:var(--fond);border:1px solid var(--bordure);border-radius:var(--rayon-petit);padding:10px;color:var(--texte-doux);font-size:12px;\">" +
            "<button type=\"submit\" class=\"aw-btn aw-btn-primaire\" id=\"btn_produit\" style=\"width:100%;margin-top:10px;\">Publier le produit</button>" +
          "</form>" +
        "</div>" +

        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Mes produits</p>" +
          "<div id=\"listeProduits\"><p style=\"color:var(--texte-doux);\">Chargement...</p></div>" +
        "</div>";

      document.getElementById("btnActiverNotif").addEventListener("click", activerNotifications);
      document.getElementById("btnPosition").addEventListener("click", enregistrerPosition);
      document.getElementById("formProduit").addEventListener("submit", ajouterProduit);
      verifierEtatNotifications();
      chargerCommandes();
      chargerProduits();
      setInterval(chargerCommandes, 25000);
    });
  });
}

function afficherNotifActives() {
  var btn = document.getElementById("btnActiverNotif");
  var msg = document.getElementById("msgNotif");
  btn.disabled = true;
  btn.textContent = "Notifications activees";
  msg.className = "msg-notif ok";
  msg.textContent = "Vous serez alerte a chaque nouvelle commande.";
}

function verifierEtatNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  if (Notification.permission !== "granted") return;
  navigator.serviceWorker.getRegistration().then(function(registration) {
    if (!registration) return;
    registration.pushManager.getSubscription().then(function(subscription) {
      if (subscription) afficherNotifActives();
    });
  });
}

function urlBase64ToUint8Array(base64String) {
  var padding = "=".repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for (var i = 0; i < rawData.length; i++) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

function activerNotifications() {
  var btn = document.getElementById("btnActiverNotif");
  var msg = document.getElementById("msgNotif");

  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    msg.className = "msg-notif err";
    msg.textContent = "Les notifications ne sont pas prises en charge sur cet appareil/navigateur.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Activation en cours...";

  navigator.serviceWorker.register("sw.js").then(function(registration) {
    return Notification.requestPermission().then(function(permission) {
      if (permission !== "granted") {
        throw new Error("Permission refusee");
      }
      return registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    });
  }).then(function(subscription) {
    var sub = subscription.toJSON();
    return sb.from("push_subscriptions").select("id").eq("subscription->>endpoint", sub.endpoint).then(function(existant) {
      if (existant.data && existant.data.length > 0) {
        return { error: null };
      }
      return sb.from("push_subscriptions").insert([{
        vendeur_id: vendeurCourant.id,
        subscription: sub
      }]);
    });
  }).then(function(reponse) {
    afficherNotifActives();
  }).catch(function(erreur) {
    btn.disabled = false;
    btn.textContent = "Activer les notifications";
    msg.className = "msg-notif err";
    msg.textContent = "Impossible d'activer les notifications. Verifiez les autorisations de votre navigateur.";
  });
}

function chargerCommandes() {
  sb.from("commandes").select("*").order("date_commande", { ascending: false }).limit(30).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeCommandes");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p style=\"color:var(--texte-doux);\">Aucune commande pour le moment.</p>";
      return;
    }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var c = data[i];
      var statutPrep = c.statut || "nouvelle";
      var statutLiv = c.statut_livraison || "en_attente_livreur";
      var libelle = LIBELLES[statutPrep] || statutPrep;
      var dateAffichee = c.date_commande ? new Date(c.date_commande).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "Date inconnue";

      html += "<div class=\"commande-carte\">" +
                "<p class=\"date-commande\">" + dateAffichee + "</p>" +
                "<h3>" + c.client_nom + "</h3>" +
                "<p>Telephone : " + c.client_telephone + "</p>" +
                "<p>" + c.produit + "</p>";
      if (c.total) {
        html += "<p>Total : " + Number(c.total).toLocaleString("fr-FR") + " FCFA</p>";
      }
      html += "<p>Adresse : " + c.adresse_livraison + "</p>" +
              "<span class=\"badge-statut badge-" + statutPrep + "\">" + libelle + "</span>";

      if (LIBELLES_LIV[statutLiv]) {
        html += "<span class=\"badge-statut badge-liv\">" + LIBELLES_LIV[statutLiv] + "</span>";
      }

      if (statutPrep === "nouvelle") {
        html += "<br><button class=\"aw-btn aw-btn-primaire btn-changer\" data-id=\"" + c.id + "\" data-statut=\"en_preparation\" style=\"margin-top:10px;\">Demarrer la preparation</button>";
      } else if (statutPrep === "en_preparation") {
        html += "<br><button class=\"aw-btn aw-btn-primaire btn-changer\" data-id=\"" + c.id + "\" data-statut=\"prete\" style=\"margin-top:10px;\">Marquer prete a livrer</button>";
      }
      html += "</div>";
    }
    zone.innerHTML = html;

    var boutons = document.getElementsByClassName("btn-changer");
    for (var b = 0; b < boutons.length; b++) {
      boutons[b].addEventListener("click", function(e) {
        changerStatut(e.target.getAttribute("data-id"), e.target.getAttribute("data-statut"));
      });
    }
  });
}

function changerStatut(id, nouveauStatut) {
  sb.from("commandes").update({ statut: nouveauStatut }).eq("id", id).then(function(reponse) {
    if (reponse.error) {
      alert("Erreur : " + reponse.error.message);
    }
    chargerCommandes();
  });
}

function enregistrerPosition() {
  var btn = document.getElementById("btnPosition");
  var zoneMsg = document.getElementById("zoneMessagePosition");

  if (!navigator.geolocation) {
    zoneMsg.innerHTML = "<div class=\"msg erreur\">La geolocalisation n'est pas disponible sur cet appareil.</div>";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Localisation en cours...";
  zoneMsg.innerHTML = "";

  navigator.geolocation.getCurrentPosition(function(position) {
    var lat = position.coords.latitude;
    var lng = position.coords.longitude;

    sb.from("vendeurs").update({ latitude: lat, longitude: lng }).eq("id", vendeurCourant.id).then(function(reponse) {
      btn.disabled = false;
      btn.textContent = "Enregistrer ma position actuelle";
      if (reponse.error) {
        zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + "</div>";
        return;
      }
      document.getElementById("statutPosition").textContent = "Position enregistree";
      zoneMsg.innerHTML = "<div class=\"msg succes\">Position enregistree avec succes !</div>";
    });
  }, function(erreur) {
    btn.disabled = false;
    btn.textContent = "Enregistrer ma position actuelle";
    zoneMsg.innerHTML = "<div class=\"msg erreur\">Impossible d'obtenir votre position. Verifiez que la localisation est activee.</div>";
  });
}

function chargerProduits() {
  sb.from("produits").select("*").eq("vendeur_id", vendeurCourant.id).order("date_ajout", { ascending: false }).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeProduits");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p style=\"color:var(--texte-doux);\">Aucun produit publie pour le moment.</p>";
      return;
    }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var p = data[i];
      html += "<div class=\"produit-carte\">" +
                "<img src=\"" + (p.image_url || "") + "\" alt=\"\">" +
                "<div class=\"produit-info\">" +
                  "<h3>" + p.nom + "</h3>" +
                  "<p class=\"prix-p\">" + p.prix + " FCFA</p>" +
                  "<p>Stock : " + p.stock + "</p>" +
                  "<p>" + (p.statut === "approuve" ? "Visible sur le site" : "En attente de validation") + "</p>" +
                "</div>" +
              "</div>";
    }
    zone.innerHTML = html;
  });
}

function ajouterProduit(event) {
  event.preventDefault();
  var btn = document.getElementById("btn_produit");
  var zoneMsg = document.getElementById("zoneMessageProduit");
  btn.disabled = true;
  btn.textContent = "Publication en cours...";
  zoneMsg.innerHTML = "";

  var nom = document.getElementById("p_nom").value;
  var description = document.getElementById("p_description").value;
  var prix = document.getElementById("p_prix").value;
  var categorie = document.getElementById("p_categorie").value;
  var stock = document.getElementById("p_stock").value;
  var fichier = document.getElementById("p_photo").files[0];
  var nomFichier = vendeurCourant.id + "_" + Date.now() + "_" + fichier.name;

  sb.storage.from("produits").upload(nomFichier, fichier).then(function(reponseUpload) {
    if (reponseUpload.error) {
      zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur photo : " + reponseUpload.error.message + "</div>";
      btn.disabled = false;
      btn.textContent = "Publier le produit";
      return;
    }
    var urlData = sb.storage.from("produits").getPublicUrl(nomFichier);
    sb.from("produits").insert([{
      vendeur_id: vendeurCourant.id,
      nom: nom,
      description: description,
      prix: prix,
      categorie: categorie,
      stock: stock,
      image_url: urlData.data.publicUrl
    }]).then(function(reponse) {
      btn.disabled = false;
      btn.textContent = "Publier le produit";
      if (reponse.error) {
        zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + "</div>";
        return;
      }
      zoneMsg.innerHTML = "<div class=\"msg succes\">Produit publie ! En attente de validation par AW SERVICES.</div>";
      document.getElementById("formProduit").reset();
      chargerProduits();
    });
  });
}

chargerEspace();
</script>

</body>
</html>
