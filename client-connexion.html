<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Mon Compte</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .back { display: inline-block; margin: var(--espace-md); color: var(--texte-doux); text-decoration: none; font-size: 14px; }
  .aw-conteneur { max-width: 420px; }

  .onglets { display: flex; gap: 8px; margin-bottom: var(--espace-md); }
  .onglet { flex: 1; background-color: var(--surface); border: 1px solid var(--bordure); color: var(--texte-doux); padding: 12px; border-radius: var(--rayon-petit); font-size: 14px; font-weight: 600; text-align: center; font-family: var(--police-titre); }
  .onglet.actif { background-color: var(--accent); border-color: var(--accent); color: #1C1200; }

  .carte-form { display: none; }
  .carte-form.visible { display: block; }

  .msg { font-size: 14px; padding: 10px; border-radius: var(--rayon-petit); margin-bottom: 12px; }
  .msg.erreur { background-color: rgba(232,72,58,0.12); color: var(--alerte); }
  .msg.succes { background-color: rgba(63,163,77,0.12); color: var(--succes); }

  .lien-oublie { text-align: center; margin-top: 12px; }
  .lien-oublie a { color: var(--accent); font-size: 13px; text-decoration: none; font-weight: 600; }
  #zoneOublie { display: none; margin-top: var(--espace-md); padding-top: var(--espace-md); border-top: 1px solid var(--bordure); }
  #zoneOublie.visible { display: block; }
</style>
</head>
<body>

<header class="aw-header">
  <h1>Mon Compte</h1>
</header>

<a href="index.html" class="back">&#8592; Retour a l'accueil</a>

<div class="aw-conteneur">
  <div class="onglets">
    <div class="onglet actif" id="ongletInscription">Creer un compte</div>
    <div class="onglet" id="ongletConnexion">Se connecter</div>
  </div>

  <div class="aw-carte carte-form visible" id="carteInscription">
    <div id="msgInscription"></div>
    <form id="formInscription">
      <label class="aw-label">Nom complet</label>
      <input class="aw-input" type="text" id="i_nom" required>
      <label class="aw-label">Numero de telephone</label>
      <input class="aw-input" type="tel" id="i_telephone" required>
      <label class="aw-label">Email</label>
      <input class="aw-input" type="email" id="i_email" required>
      <label class="aw-label">Mot de passe</label>
      <input class="aw-input" type="password" id="i_password" required minlength="6">
      <label class="aw-label">Confirmer le mot de passe</label>
      <input class="aw-input" type="password" id="i_password2" required minlength="6">
      <button type="submit" class="aw-btn aw-btn-primaire" id="btnInscription" style="width:100%;margin-top:14px;">Creer mon compte</button>
    </form>
  </div>

  <div class="aw-carte carte-form" id="carteConnexion">
    <div id="msgConnexion"></div>
    <form id="formConnexion">
      <label class="aw-label">Email</label>
      <input class="aw-input" type="email" id="c_email" required>
      <label class="aw-label">Mot de passe</label>
      <input class="aw-input" type="password" id="c_password" required>
      <button type="submit" class="aw-btn aw-btn-primaire" id="btnConnexion" style="width:100%;margin-top:14px;">Se connecter</button>
    </form>
    <div class="lien-oublie"><a href="#" id="lienOublie">Mot de passe oublie ?</a></div>

    <div id="zoneOublie">
      <label class="aw-label">Votre email</label>
      <input class="aw-input" type="email" id="o_email">
      <button type="button" class="aw-btn aw-btn-secondaire" id="btnEnvoyerReset" style="width:100%;margin-top:10px;">Envoyer le lien de reinitialisation</button>
      <div id="msgOublie"></div>
    </div>
  </div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

document.getElementById("ongletInscription").addEventListener("click", function() {
  document.getElementById("ongletInscription").classList.add("actif");
  document.getElementById("ongletConnexion").classList.remove("actif");
  document.getElementById("carteInscription").classList.add("visible");
  document.getElementById("carteConnexion").classList.remove("visible");
});

document.getElementById("ongletConnexion").addEventListener("click", function() {
  document.getElementById("ongletConnexion").classList.add("actif");
  document.getElementById("ongletInscription").classList.remove("actif");
  document.getElementById("carteConnexion").classList.add("visible");
  document.getElementById("carteInscription").classList.remove("visible");
});

document.getElementById("formInscription").addEventListener("submit", function(event) {
  event.preventDefault();
  var btn = document.getElementById("btnInscription");
  var msg = document.getElementById("msgInscription");
  var nom = document.getElementById("i_nom").value;
  var telephone = document.getElementById("i_telephone").value;
  var email = document.getElementById("i_email").value;
  var password = document.getElementById("i_password").value;
  var password2 = document.getElementById("i_password2").value;

  if (password !== password2) {
    msg.innerHTML = "<div class=\"msg erreur\">Les mots de passe ne correspondent pas.</div>";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Creation en cours...";

  sb.auth.signUp({
    email: email,
    password: password,
    options: { data: { nom: nom, telephone: telephone } }
  }).then(function(reponse) {
    btn.disabled = false;
    btn.textContent = "Creer mon compte";
    if (reponse.error) {
      msg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + "</div>";
      return;
    }
    msg.innerHTML = "<div class=\"msg succes\">Compte cree ! Verifiez votre email pour confirmer, puis connectez-vous.</div>";
    document.getElementById("formInscription").reset();
  });
});

document.getElementById("formConnexion").addEventListener("submit", function(event) {
  event.preventDefault();
  var btn = document.getElementById("btnConnexion");
  var msg = document.getElementById("msgConnexion");
  var email = document.getElementById("c_email").value;
  var password = document.getElementById("c_password").value;

  btn.disabled = true;
  btn.textContent = "Connexion en cours...";

  sb.auth.signInWithPassword({ email: email, password: password }).then(function(reponse) {
    if (reponse.error) {
      btn.disabled = false;
      btn.textContent = "Se connecter";
      msg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + "</div>";
      return;
    }

    var user = reponse.data.user;
    sb.from("clients").select("*").eq("user_id", user.id).maybeSingle().then(function(reponseProfil) {
      if (reponseProfil.data) {
        window.location.href = "client-espace.html";
        return;
      }
      var nomStocke = (user.user_metadata && user.user_metadata.nom) ? user.user_metadata.nom : user.email;
      var telStocke = (user.user_metadata && user.user_metadata.telephone) ? user.user_metadata.telephone : "";
      sb.from("clients").insert([{
        nom: nomStocke,
        telephone: telStocke,
        user_id: user.id
      }]).then(function(reponseInsert) {
        btn.disabled = false;
        btn.textContent = "Se connecter";
        if (reponseInsert.error) {
          msg.innerHTML = "<div class=\"msg erreur\">Erreur profil : " + reponseInsert.error.message + "</div>";
          return;
        }
        window.location.href = "client-espace.html";
      });
    });
  });
});

document.getElementById("lienOublie").addEventListener("click", function(event) {
  event.preventDefault();
  document.getElementById("zoneOublie").classList.toggle("visible");
});

document.getElementById("btnEnvoyerReset").addEventListener("click", function() {
  var btn = document.getElementById("btnEnvoyerReset");
  var msg = document.getElementById("msgOublie");
  var email = document.getElementById("o_email").value;

  if (!email) {
    msg.innerHTML = "<div class=\"msg erreur\">Entrez votre email.</div>";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Envoi en cours...";

  sb.auth.resetPasswordForEmail(email, {
    redirectTo: "https://awmamadou394-ops.github.io/aw-services-site/reinitialiser-mot-de-passe.html"
  }).then(function(reponse) {
    btn.disabled = false;
    btn.textContent = "Envoyer le lien de reinitialisation";
    if (reponse.error) {
      msg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + "</div>";
      return;
    }
    msg.innerHTML = "<div class=\"msg succes\">Email envoye ! Verifiez votre boite mail (et les spams).</div>";
  });
});
</script>

</body>
</html>
