<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Nouveau mot de passe</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .aw-conteneur { max-width: 420px; }

  .msg { font-size: 14px; padding: 10px; border-radius: var(--rayon-petit); margin-top: 12px; }
  .msg.erreur { background-color: rgba(232,72,58,0.12); color: var(--alerte); }
  .msg.succes { background-color: rgba(63,163,77,0.12); color: var(--succes); }

  .liens-espaces { margin-top: var(--espace-md); display: none; }
  .liens-espaces.visible { display: block; }
  .liens-espaces p { font-size: 13px; color: var(--texte-doux); margin-bottom: 10px; text-align: center; }
  .liens-espaces a { display: block; text-align: center; background-color: var(--surface); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 12px; color: var(--texte); text-decoration: none; font-weight: 700; font-size: 14px; margin-bottom: 8px; font-family: var(--police-titre); }
</style>
</head>
<body>

<header class="aw-header">
  <h1>AW SERVICES</h1>
</header>

<div class="aw-conteneur">
  <div class="aw-carte" style="margin-top: var(--espace-lg);">
    <p class="aw-section-titre">Choisir un nouveau mot de passe</p>
    <form id="formReset">
      <label class="aw-label">Nouveau mot de passe</label>
      <input class="aw-input" type="password" id="nouveauMdp" required minlength="6">
      <label class="aw-label">Confirmer le mot de passe</label>
      <input class="aw-input" type="password" id="confirmerMdp" required minlength="6">
      <button type="submit" class="aw-btn aw-btn-primaire" id="btnReset" style="width:100%;margin-top:10px;">Valider le nouveau mot de passe</button>
    </form>
    <div id="zoneMsg"></div>
    <div class="liens-espaces" id="liensEspaces">
      <p>Connectez-vous a votre espace :</p>
      <a href="client-connexion.html">Espace Client</a>
      <a href="vendeur-connexion.html">Espace Vendeur</a>
      <a href="livreur-connexion.html">Espace Livreur</a>
    </div>
  </div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

document.getElementById("formReset").addEventListener("submit", function(event) {
  event.preventDefault();
  var btn = document.getElementById("btnReset");
  var zoneMsg = document.getElementById("zoneMsg");
  var nouveau = document.getElementById("nouveauMdp").value;
  var confirmer = document.getElementById("confirmerMdp").value;

  if (nouveau !== confirmer) {
    zoneMsg.innerHTML = "<div class=\"msg erreur\">Les deux mots de passe ne correspondent pas.</div>";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Enregistrement...";

  sb.auth.updateUser({ password: nouveau }).then(function(reponse) {
    btn.disabled = false;
    btn.textContent = "Valider le nouveau mot de passe";
    if (reponse.error) {
      zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + ". Le lien a peut-etre expire, redemandez une reinitialisation.</div>";
      return;
    }
    zoneMsg.innerHTML = "<div class=\"msg succes\">Mot de passe modifie avec succes !</div>";
    document.getElementById("formReset").style.display = "none";
    document.getElementById("liensEspaces").classList.add("visible");
  });
});
</script>

</body>
</html>
