<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Gestion Boutique</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .back { display: inline-block; margin: var(--espace-md); color: var(--texte-doux); text-decoration: none; font-size: 14px; }

  .msg { font-size: 14px; padding: 10px; border-radius: var(--rayon-petit); margin-bottom: 12px; }
  .msg.erreur { background-color: rgba(232,72,58,0.12); color: var(--alerte); }
  .msg.succes { background-color: rgba(63,163,77,0.12); color: var(--succes); }

  .prod-carte { display: flex; gap: 10px; background-color: var(--fond); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 10px; margin-bottom: 10px; }
  .prod-carte img { width: 60px; height: 60px; border-radius: var(--rayon-petit); object-fit: cover; background-color: var(--surface); }
  .prod-info { flex: 1; }
  .prod-info h3 { font-size: 14px; font-family: var(--police-titre); }
  .prod-info p { font-size: 12px; color: var(--texte-doux); margin-top: 2px; }
  .btn-suppr { background-color: transparent; border: 1px solid var(--alerte); color: var(--alerte); padding: 6px 10px; border-radius: var(--rayon-petit); font-size: 12px; margin-top: 6px; font-family: var(--police-texte); }
  .chargement { text-align: center; padding: 30px; color: var(--texte-doux); }
</style>
</head>
<body>

<header class="aw-header">
  <h1>Gestion Boutique</h1>
</header>

<a href="admin-espace.html" class="back">&#8592; Retour a l'administration</a>

<div class="aw-conteneur">
  <div id="zoneContenu" class="chargement">Verification des droits...</div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

function verifierEtCharger() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "admin-connexion.html";
      return;
    }
    sb.from("admins").select("*").eq("user_id", user.id).single().then(function(reponseAdmin) {
      var admin = reponseAdmin.data;
      var zone = document.getElementById("zoneContenu");
      if (!admin) {
        zone.innerHTML = "<div class=\"aw-carte\"><p>Acces refuse.</p></div>";
        return;
      }
      zone.innerHTML =
        "<div class=\"aw-carte\">" +
          "<p class=\"aw-section-titre\">Ajouter un produit AW SERVICES</p>" +
          "<div id=\"zoneMessage\"></div>" +
          "<form id=\"formProduit\">" +
            "<label class=\"aw-label\">Nom du produit</label>" +
            "<input class=\"aw-input\" type=\"text\" id=\"p_nom\" placeholder=\"Ex : Casque Bluetooth\" required>" +
            "<label class=\"aw-label\">Description</label>" +
            "<textarea class=\"aw-textarea\" id=\"p_description\" rows=\"3\" placeholder=\"Decrivez le produit\"></textarea>" +
            "<label class=\"aw-label\">Prix (FCFA)</label>" +
            "<input class=\"aw-input\" type=\"number\" id=\"p_prix\" placeholder=\"Ex : 15000\" required>" +
            "<label class=\"aw-label\">Categorie</label>" +
            "<input class=\"aw-input\" type=\"text\" id=\"p_categorie\" placeholder=\"Ex : Electronique\" required>" +
            "<label class=\"aw-label\">Quantite en stock</label>" +
            "<input class=\"aw-input\" type=\"number\" id=\"p_stock\" placeholder=\"Ex : 10\" required>" +
            "<label class=\"aw-label\">Photo</label>" +
            "<input type=\"file\" id=\"p_photo\" accept=\"image/*\" required style=\"background-color:var(--fond);border:1px solid var(--bordure);border-radius:var(--rayon-petit);padding:10px;color:var(--texte-doux);font-size:12px;\">" +
            "<button type=\"submit\" class=\"aw-btn aw-btn-primaire\" id=\"btn_produit\" style=\"width:100%;margin-top:10px;\">Publier le produit</button>" +
          "</form>" +
        "</div>" +
        "<div class=\"aw-carte\" style=\"margin-top:15px;\">" +
          "<p class=\"aw-section-titre\">Tous les produits</p>" +
          "<div id=\"listeProduits\"><p style=\"color:var(--texte-doux);\">Chargement...</p></div>" +
        "</div>";

      document.getElementById("formProduit").addEventListener("submit", ajouterProduit);
      chargerProduits();
    });
  });
}

function chargerProduits() {
  sb.from("produits").select("*").order("date_ajout", { ascending: false }).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeProduits");
    if (!data || data.length === 0) { zone.innerHTML = "<p style=\"color:var(--texte-doux);\">Aucun produit.</p>"; return; }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var p = data[i];
      html += "<div class=\"prod-carte\">" +
                "<img src=\"" + (p.image_url || "") + "\" alt=\"\">" +
                "<div class=\"prod-info\">" +
                  "<h3>" + p.nom + "</h3>" +
                  "<p>" + p.prix + " FCFA - Stock : " + p.stock + " - " + p.statut + "</p>" +
                  "<button class=\"btn-suppr btn-suppr-prod\" data-id=\"" + p.id + "\">Supprimer</button>" +
                "</div>" +
              "</div>";
    }
    zone.innerHTML = html;
    var boutons = document.getElementsByClassName("btn-suppr-prod");
    for (var j = 0; j < boutons.length; j++) {
      boutons[j].addEventListener("click", function(e) {
        var id = e.target.getAttribute("data-id");
        if (!confirm("Supprimer definitivement ce produit ?")) return;
        sb.from("produits").delete().eq("id", id).then(function() {
          chargerProduits();
        });
      });
    }
  });
}

function ajouterProduit(event) {
  event.preventDefault();
  var btn = document.getElementById("btn_produit");
  var zoneMsg = document.getElementById("zoneMessage");
  btn.disabled = true;
  btn.textContent = "Publication en cours...";

  var nom = document.getElementById("p_nom").value;
  var description = document.getElementById("p_description").value;
  var prix = document.getElementById("p_prix").value;
  var categorie = document.getElementById("p_categorie").value;
  var stock = document.getElementById("p_stock").value;
  var fichier = document.getElementById("p_photo").files[0];
  var nomFichier = "admin_" + Date.now() + "_" + fichier.name;

  sb.storage.from("produits").upload(nomFichier, fichier).then(function(reponseUpload) {
    if (reponseUpload.error) {
      zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur photo : " + reponseUpload.error.message + "</div>";
      btn.disabled = false;
      btn.textContent = "Publier le produit";
      return;
    }
    var urlData = sb.storage.from("produits").getPublicUrl(nomFichier);
    sb.from("produits").insert([{
      nom: nom,
      description: description,
      prix: prix,
      categorie: categorie,
      stock: stock,
      image_url: urlData.data.publicUrl,
      statut: "approuve"
    }]).then(function(reponse) {
      btn.disabled = false;
      btn.textContent = "Publier le produit";
      if (reponse.error) {
        zoneMsg.innerHTML = "<div class=\"msg erreur\">Erreur : " + reponse.error.message + "</div>";
        return;
      }
      zoneMsg.innerHTML = "<div class=\"msg succes\">Produit publie et visible immediatement !</div>";
      document.getElementById("formProduit").reset();
      chargerProduits();
    });
  });
}

verifierEtCharger();
</script>

</body>
</html>
