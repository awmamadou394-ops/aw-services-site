<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Administration</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .aw-conteneur { max-width: 420px; }

  .onglets { display: flex; gap: 8px; margin-bottom: var(--espace-md); }
  .onglet { flex: 1; text-align: center; background-color: var(--surface); border: 1px solid var(--bordure); color: var(--texte-doux); padding: 12px; border-radius: var(--rayon-petit); font-size: 14px; font-weight: 600; font-family: var(--police-titre); }
  .onglet.actif { background-color: var(--accent); border-color: var(--accent); color: #1C1200; }

  .msg { font-size: 14px; padding: 10px; border-radius: var(--rayon-petit); margin-bottom: 15px; }
  .msg.erreur { background-color: rgba(232,72,58,0.12); color: var(--alerte); }
  .msg.succes { background-color: rgba(63,163,77,0.12); color: var(--succes); }
</style>
</head>
<body>

<header class="aw-header">
  <h1>AW SERVICES — Administration</h1>
</header>

<div class="aw-conteneur">
  <div class="onglets">
    <div class="onglet actif" id="ongletInscription" onclick="afficherInscription()">Creer un compte</div>
    <div class="onglet" id="ongletConnexion" onclick="afficherConnexion()">Se connecter</div>
  </div>

  <div id="zoneMessage"></div>

  <form id="formInscription" class="aw-carte" style="display:flex;flex-direction:column;" onsubmit="inscrire(event)">
    <label class="aw-label">Adresse email</label>
    <input class="aw-input" type="email" id="i_email" placeholder="votre@email.com" required>

    <label class="aw-label">Mot de passe</label>
    <input class="aw-input" type="password" id="i_password" placeholder="6 caracteres minimum" minlength="6" required>

    <label class="aw-label">Confirmer le mot de passe</label>
    <input class="aw-input" type="password" id="i_password_confirm" placeholder="Retapez le mot de passe" minlength="6" required>

    <button type="submit" class="aw-btn aw-btn-primaire" id="btn_inscription" style="width:100%;">Creer mon compte</button>
  </form>

  <form id="formConnexion" class="aw-carte" style="display:none;flex-direction:column;" onsubmit="connecter(event)">
    <label class="aw-label">Adresse email</label>
    <input class="aw-input" type="email" id="c_email" placeholder="votre@email.com" required>

    <label class="aw-label">Mot de passe</label>
    <input class="aw-input" type="password" id="c_password" placeholder="Votre mot de passe" required>

    <button type="submit" class="aw-btn aw-btn-primaire" id="btn_connexion" style="width:100%;">Se connecter</button>
  </form>
</div>

<script>
const sb = supabase.createClient(
  'https://vnceunqygoiwglnwpgcr.supabase.co',
  'sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK'
);

function afficherInscription() {
  document.getElementById('formInscription').style.display = 'flex';
  document.getElementById('formConnexion').style.display = 'none';
  document.getElementById('ongletInscription').classList.add('actif');
  document.getElementById('ongletConnexion').classList.remove('actif');
}

function afficherConnexion() {
  document.getElementById('formInscription').style.display = 'none';
  document.getElementById('formConnexion').style.display = 'flex';
  document.getElementById('ongletInscription').classList.remove('actif');
  document.getElementById('ongletConnexion').classList.add('actif');
}

function afficherMessage(texte, type) {
  document.getElementById('zoneMessage').innerHTML = '<div class="msg ' + type + '">' + texte + '</div>';
}

async function inscrire(event) {
  event.preventDefault();
  var password = document.getElementById('i_password').value;
  var passwordConfirm = document.getElementById('i_password_confirm').value;

  if (password !== passwordConfirm) {
    afficherMessage('Les mots de passe ne correspondent pas.', 'erreur');
    return;
  }

  var btn = document.getElementById('btn_inscription');
  btn.disabled = true;
  btn.textContent = 'Creation en cours...';

  var email = document.getElementById('i_email').value;
  const { error } = await sb.auth.signUp({ email: email, password: password });

  btn.disabled = false;
  btn.textContent = 'Creer mon compte';

  if (error) {
    afficherMessage('Erreur : ' + error.message, 'erreur');
    return;
  }

  afficherMessage('Compte cree ! Confirmez votre email, puis contactez le developpeur pour activer vos droits admin.', 'succes');
  document.getElementById('formInscription').reset();
}

async function connecter(event) {
  event.preventDefault();
  var btn = document.getElementById('btn_connexion');
  btn.disabled = true;
  btn.textContent = 'Connexion en cours...';

  var email = document.getElementById('c_email').value;
  var password = document.getElementById('c_password').value;

  const { error } = await sb.auth.signInWithPassword({ email: email, password: password });

  btn.disabled = false;
  btn.textContent = 'Se connecter';

  if (error) {
    afficherMessage('Erreur : ' + error.message, 'erreur');
    return;
  }

  window.location.href = 'admin-espace.html';
}
</script>

</body>
</html>
