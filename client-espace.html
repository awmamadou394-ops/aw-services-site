<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Mes Commandes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background-color: #0a0e17; color: #ffffff; }
  header { background-color: #0d1220; padding: 20px; border-bottom: 2px solid #d62828; display: flex; justify-content: space-between; align-items: center; }
  header h1 { color: #1e6fd9; font-size: 18px; }
  .deconnexion { background-color: transparent; border: 1px solid #d62828; color: #d62828; padding: 8px 14px; border-radius: 6px; font-size: 13px; }
  .content { padding: 20px 15px; max-width: 550px; margin: 0 auto; }
  .carte { background-color: #121826; border: 1px solid #1e6fd9; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
  .carte h2 { font-size: 16px; margin-bottom: 10px; }
  .info { color: #b0b8c5; font-size: 14px; margin-top: 6px; }
  .chargement { text-align: center; padding: 40px; color: #b0b8c5; }
  .lien-boutique { display: block; text-align: center; background-color: #1e6fd9; color: #ffffff; text-decoration: none; padding: 13px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-bottom: 15px; }

  .btn-notif { background-color: #1e6fd9; color: #ffffff; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; width: 100%; margin-top: 8px; }
  .btn-notif:disabled { opacity: 0.6; }
  .msg-notif { font-size: 12px; margin-top: 8px; color: #b0b8c5; }
  .msg-notif.ok { color: #80ff9e; }
  .msg-notif.err { color: #ff8080; }

  .commande-carte { background-color: #0a0e17; border: 1px solid #2a3040; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .commande-carte h3 { font-size: 14px; margin-bottom: 4px; }
  .commande-carte .date { font-size: 11px; color: #b0b8c5; margin-bottom: 10px; }
  .commande-carte .articles { font-size: 13px; color: #b0b8c5; margin-bottom: 4px; }
  .commande-carte .total { font-size: 14px; color: #d62828; font-weight: bold; margin-bottom: 12px; }

  .etapes { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .etape { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #6a7383; }
  .etape.faite { color: #80ff9e; }
  .etape.active { color: #ffffff; font-weight: bold; }
  .pastille { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #2a3040; flex-shrink: 0; }
  .etape.faite .pastille { background-color: #80ff9e; border-color: #80ff9e; }
  .etape.active .pastille { background-color: #1e6fd9; border-color: #1e6fd9; }
</style>
</head>
<body>

<header>
  <h1>Mes Commandes</h1>
  <button class="deconnexion" id="btnDeconnexion">Deconnexion</button>
</header>

<div class="content">
  <div id="zoneContenu" class="chargement">Chargement...</div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

var VAPID_PUBLIC_KEY = "BJw5df2L2JS-HB2BoXP7QNx1caYe4F1PaLbXy6kY1KI7SY9Evt5GjH19HsacU1iT9547pf6sjUeVsThHd8mOkr0";
var clientCourant = null;

var ETAPES = [
  "Commande recue",
  "Preparation de votre commande",
  "Un livreur vient recuperer votre commande",
  "Commande prete",
  "Le livreur est en route vers vous",
  "Commande livree"
];

document.getElementById("btnDeconnexion").addEventListener("click", function() {
  sb.auth.signOut().then(function() {
    window.location.href = "client-connexion.html";
  });
});

function chargerEspace() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "client-connexion.html";
      return;
    }
    sb.from("clients").select("*").eq("user_id", user.id).single().then(function(reponse) {
      var client = reponse.data;
      var zone = document.getElementById("zoneContenu");
      if (reponse.error || !client) {
        zone.innerHTML = "<div class=\"carte\"><p class=\"info\">Profil introuvable. Contactez AW SERVICES.</p></div>";
        return;
      }
      clientCourant = client;

      zone.innerHTML =
        "<div class=\"carte\">" +
          "<h2>Bonjour, " + client.nom + "</h2>" +
          "<p class=\"info\">Telephone : " + (client.telephone || "-") + "</p>" +
        "</div>" +
        "<div class=\"carte\">" +
          "<h2>Notifications</h2>" +
          "<p class=\"info\">Soyez alerte a chaque etape de votre commande.</p>" +
          "<button class=\"btn-notif\" id=\"btnActiverNotif\">Activer les notifications</button>" +
          "<p class=\"msg-notif\" id=\"msgNotif\"></p>" +
        "</div>" +
        "<a href=\"catalogue.html\" class=\"lien-boutique\">Parcourir la boutique</a>" +
        "<div class=\"carte\">" +
          "<h2>Suivi de mes commandes</h2>" +
          "<div id=\"listeCommandes\"><p class=\"info\">Chargement...</p></div>" +
        "</div>";

      document.getElementById("btnActiverNotif").addEventListener("click", activerNotifications);
      chargerCommandes();
      setInterval(chargerCommandes, 20000);
    });
  });
}

function urlBase64ToUint8Array(base64String) {
  var padding = "=".repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for (var i = 0; i < rawData.length; i++) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

function activerNotifications() {
  var btn = document.getElementById("btnActiverNotif");
  var msg = document.getElementById("msgNotif");

  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    msg.className = "msg-notif err";
    msg.textContent = "Les notifications ne sont pas prises en charge sur cet appareil/navigateur.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Activation en cours...";

  navigator.serviceWorker.register("sw.js").then(function(registration) {
    return Notification.requestPermission().then(function(permission) {
      if (permission !== "granted") {
        throw new Error("Permission refusee");
      }
      return registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    });
  }).then(function(subscription) {
    return sb.from("push_subscriptions").insert([{
      client_id: clientCourant.id,
      subscription: subscription.toJSON()
    }]);
  }).then(function(reponse) {
    btn.textContent = "Notifications activees";
    msg.className = "msg-notif ok";
    msg.textContent = "Vous serez alerte a chaque etape de vos commandes.";
  }).catch(function(erreur) {
    btn.disabled = false;
    btn.textContent = "Activer les notifications";
    msg.className = "msg-notif err";
    msg.textContent = "Impossible d'activer les notifications. Verifiez les autorisations de votre navigateur.";
  });
}

function calculerEtapes(statutPrep, statutLiv) {
  var faites = [true, false, false, false, false, false];
  var active = 0;

  if (statutPrep === "en_preparation" || statutPrep === "prete") {
    faites[1] = true;
  }
  if (statutLiv === "vers_boutique" || statutLiv === "en_livraison" || statutLiv === "livree") {
    faites[2] = true;
  }
  if (statutPrep === "prete") {
    faites[3] = true;
  }
  if (statutLiv === "en_livraison" || statutLiv === "livree") {
    faites[4] = true;
  }
  if (statutLiv === "livree") {
    faites[5] = true;
  }

  for (var i = 5; i >= 0; i--) {
    if (faites[i]) { active = i; break; }
  }
  return { faites: faites, active: active };
}

function chargerCommandes() {
  sb.from("commandes").select("*").eq("client_id", clientCourant.id).order("date_commande", { ascending: false }).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeCommandes");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p class=\"info\">Vous n'avez pas encore passe de commande.</p>";
      return;
    }

    var html = "";
    for (var i = 0; i < data.length; i++) {
      var c = data[i];
      var etat = calculerEtapes(c.statut || "nouvelle", c.statut_livraison || "en_attente_livreur");

      var dateAffichee = new Date(c.date_commande).toLocaleDateString("fr-FR") + " a " + new Date(c.date_commande).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

      html += "<div class=\"commande-carte\">" +
                "<h3>Commande</h3>" +
                "<div class=\"date\">" + dateAffichee + "</div>" +
                "<div class=\"articles\">" + c.produit + "</div>";
      if (c.total) {
        html += "<div class=\"total\">Total : " + Number(c.total).toLocaleString("fr-FR") + " FCFA</div>";
      }
      html += "<div class=\"etapes\">";
      for (var j = 0; j < ETAPES.length; j++) {
        var classe = "etape";
        if (etat.faites[j] && j !== etat.active) classe += " faite";
        if (j === etat.active) classe += " active";
        html += "<div class=\"" + classe + "\"><span class=\"pastille\"></span>" + ETAPES[j] + "</div>";
      }
      html += "</div></div>";
    }
    zone.innerHTML = html;
  });
}

chargerEspace();
</script>

</body>
</html>
