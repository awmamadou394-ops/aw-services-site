}

var MOIS_FR = ["Janvier","Fevrier","Mars","Avril","Mai","Juin","Juillet","Aout","Septembre","Octobre","Novembre","Decembre"];
function formatDateFr(dateStr) {
  if (!dateStr) return "";
  var parts = dateStr.split("-");
  if (parts.length !== 3) return dateStr;
  var jour = parseInt(parts[2], 10);
  var mois = MOIS_FR[parseInt(parts[1], 10) - 1];
  return jour + " " + mois + " " + parts[0];
}

  return nom.length < 2 || nom.indexOf("@") !== -1 || !String(client.telephone || "").trim();

  document.getElementById("btnEnregistrerProfil").addEventListener("click", enregistrerProfil);

function enregistrerProfil() {

    return;
  }
  if (!/^[0-9+ ]{6,20}$/.test(telephone)) {
    msg.className = "msg-profil err";
    msg.textContent = "Numero de telephone invalide (chiffres, espaces ou + uniquement).";

  btn.disabled = true;

  sb.from("clients").update({ nom: nom, telephone: telephone }).eq("id", clientCourant.id).select().single().then(function(reponse) {

function basculerOnglet(nom) {

function afficherNotifActives() {

}

function verifierEtatNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  if (Notification.permission !== "granted") return;
  navigator.serviceWorker.getRegistration().then(function(registration) {
    if (!registration) return;
    registration.pushManager.getSubscription().then(function(subscription) {
      if (subscription) afficherNotifActives();
    });
  });
}

function urlBase64ToUint8Array(base64String) {
  var padding = "=".repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for (var i = 0; i < rawData.length; i++) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

function activerNotifications() {
  var btn = document.getElementById("btnActiverNotif");
  var msg = document.getElementById("msgNotif");

  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    msg.className = "msg-notif err";
    msg.textContent = "Les notifications ne sont pas prises en charge sur cet appareil/navigateur.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Activation en cours...";

  navigator.serviceWorker.register("sw.js").then(function(registration) {
    return Notification.requestPermission().then(function(permission) {
      if (permission !== "granted") {
        throw new Error("Permission refusee");
      }
      return registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    });
  }).then(function(subscription) {
    var sub = subscription.toJSON();
    return sb.from("push_subscriptions").select("id").eq("subscription->>endpoint", sub.endpoint).then(function(existant) {
      if (existant.data && existant.data.length > 0) {
        return { error: null };
      }
      return sb.from("push_subscriptions").insert([{
        client_id: clientCourant.id,
        subscription: sub
      }]);
    });
  }).then(function(reponse) {
    afficherNotifActives();
  }).catch(function(erreur) {
    btn.disabled = false;
    btn.textContent = "Activer les notifications";
    msg.className = "msg-notif err";
    msg.textContent = "Impossible d'activer les notifications. Verifiez les autorisations de votre navigateur.";
  });
}

function calculerEtapes(statutPrep, statutLiv) {
  var faites = [true, false, false, false, false, false];
  var active = 0;

  if (statutPrep === "en_preparation" || statutPrep === "prete") {
    faites[1] = true;
  }
  if (statutLiv === "vers_boutique" || statutLiv === "en_livraison" || statutLiv === "livree") {
    faites[2] = true;
  }
  if (statutPrep === "prete") {
    faites[3] = true;
  }
  if (statutLiv === "en_livraison" || statutLiv === "livree") {
    faites[4] = true;
  }
  if (statutLiv === "livree") {
    faites[5] = true;
  }

  for (var i = 5; i >= 0; i--) {
    if (faites[i]) { active = i; break; }
  }
  return { faites: faites, active: active };
}

function chargerCommandes() {
  sb.from("commandes").select("*").eq("client_id", clientCourant.id).order("date_commande", { ascending: false }).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeCommandes");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p class=\"vide\">Vous n'avez pas encore passe de commande.</p>";
      return;
    }

    var html = "";
    for (var i = 0; i < data.length; i++) {
      var c = data[i];
      var etat = calculerEtapes(c.statut || "nouvelle", c.statut_livraison || "en_attente_livreur");
      var dateAffichee = new Date(c.date_commande).toLocaleDateString("fr-FR") + " a " + new Date(c.date_commande).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      var classeBadge = c.statut_paiement === "paye" ? "badge-paye" : "badge-nonpaye";
      var texteBadge = c.statut_paiement === "paye" ? "Paye" : "Non paye";

      html += "<div class=\"commande-carte\">" +
                "<div class=\"date\">" + dateAffichee + "</div>" +
                "<h3>" + escapeHtml(c.produit) + "</h3>";
      if (c.total) {
        html += "<div class=\"total\">Total : " + Number(c.total).toLocaleString("fr-FR") + " FCFA</div>";
      }
      html += "<span class=\"badge-statut " + classeBadge + "\">" + texteBadge + "</span>";
      html += "<div class=\"etapes\">";
      for (var j = 0; j < ETAPES.length; j++) {
        var classe = "etape";
        if (etat.faites[j] && j !== etat.active) classe += " faite";
        if (j === etat.active) classe += " active";
        html += "<div class=\"" + classe + "\"><span class=\"pastille-etape\"></span>" + ETAPES[j] + "</div>";
      }
      html += "</div></div>";
    }
    zone.innerHTML = html;
  });
}

  sb.from("courses_moto").select("*").eq("client_id", clientCourant.id).limit(20).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeCoursesClient");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p class=\"vide\">Vous n'avez pas encore demande de course moto.</p>";
      return;
    }

    var html = "";
    for (var i = 0; i < data.length; i++) {
      var c = data[i];
      var classeBadge = CLASSES_COURSE_CLIENT[c.statut] || "badge-neutre";
      var texteBadge = LIBELLES_COURSE_CLIENT[c.statut] || c.statut;

      html += "<div class=\"commande-carte\">" +
                "<h3>Vers " + escapeHtml(c.lieu_arrivee) + "</h3>" +
                (c.distance_km ? "<p>Distance : " + c.distance_km + " km</p>" : "") +
                (c.prix_total ? "<div class=\"total\">" + Number(c.prix_total).toLocaleString("fr-FR") + " FCFA (" + escapeHtml(c.mode_paiement) + ")</div>" : "") +
                "<span class=\"badge-statut " + classeBadge + "\">" + texteBadge + "</span>" +
              "</div>";
    }
    zone.innerHTML = html;
  });
}

var ETAPES_DOSSIER = ["recu", "en_cours", "admission", "visa", "termine"];
var LIBELLES_DOSSIER = {
  recu: "Dossier recu",
  en_cours: "En cours de traitement",
  admission: "Admission obtenue",
  visa: "Visa en cours",
  termine: "Termine",
  refuse: "Refuse"
};

function chargerDossiersVoyage() {
  sb.from("preinscriptions_voyage").select("*").eq("client_id", clientCourant.id).order("date_soumission", { ascending: false }).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeDossiersVoyage");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p class=\"vide\">Vous n'avez pas encore de dossier d'etudes a l'etranger. <a href=\"voyage.html\" style=\"color:var(--accent);font-weight:700;text-decoration:none;\">Voir les destinations</a></p>";
      return;
    }

    var html = "";
    for (var i = 0; i < data.length; i++) {
      var d = data[i];
      var statut = d.statut_dossier || "recu";
      var dateAffichee = d.date_soumission ? new Date(d.date_soumission).toLocaleDateString("fr-FR") : "";
      var badgePaiement = "";
      if (d.pays === "Russie" && !d.montant_frais) {
        badgePaiement = "<span class=\"badge-statut badge-neutre\">Tarif sur devis</span>";
      } else if (d.statut_paiement === "paye") {
        badgePaiement = "<span class=\"badge-statut badge-paye\">Frais de dossier payes</span>";
      } else {
        badgePaiement = "<span class=\"badge-statut badge-nonpaye\">Frais de dossier non payes</span>";
      }

      html += "<div class=\"commande-carte\">" +
                "<div class=\"date\">Depose le " + dateAffichee + "</div>" +
                "<h3>Etudes : " + escapeHtml(d.pays) + (d.type_etablissement ? " (" + escapeHtml(d.type_etablissement) + ")" : "") + "</h3>" +
                "<p>Niveau : " + escapeHtml(d.niveau) + "</p>" +
                (d.montant_frais ? "<div class=\"total\">" + Number(d.montant_frais).toLocaleString("fr-FR") + " FCFA</div>" : "") +
                badgePaiement;

      if (statut === "refuse") {
        html += "<p class=\"dossier-refuse\">Dossier refuse</p>";
      } else {
        var indexActuel = ETAPES_DOSSIER.indexOf(statut);
        if (indexActuel === -1) indexActuel = 0;
        html += "<div class=\"etapes\">";
        for (var j = 0; j < ETAPES_DOSSIER.length; j++) {
          var classe = "etape";
          if (j < indexActuel || (j === indexActuel && statut === "termine")) classe += " faite";
          if (j === indexActuel && statut !== "termine") classe += " active";
          html += "<div class=\"" + classe + "\"><span class=\"pastille-etape\"></span>" + LIBELLES_DOSSIER[ETAPES_DOSSIER[j]] + "</div>";
        }
        html += "</div>";
      }

      if (d.message_admin) {
        html += "<div class=\"message-admin\">" +
                  "<div class=\"titre-msg\">Message d'AW SERVICES" + (d.date_maj_dossier ? " - " + new Date(d.date_maj_dossier).toLocaleDateString("fr-FR") : "") + "</div>" +
                  escapeHtml(d.message_admin) +
                "</div>";
      }
      html += "</div>";
    }
    zone.innerHTML = html;
  });
}

/* ---------- Sejours (logements loues a la nuit) ---------- */

function badgeReservationLocation(r) {
  if (r.statut === "annulee") return "<span class=\"badge-statut badge-annulee\">Annulee</span>";
  if (r.statut === "confirmee" || r.statut_paiement === "paye") return "<span class=\"badge-statut badge-paye\">Confirmee - payee</span>";
  var expiree = (Date.now() - new Date(r.date_creation).getTime()) > 30 * 60000;
  if (expiree) return "<span class=\"badge-statut badge-annulee\">Non payee - expiree</span>";
  return "<span class=\"badge-statut badge-nonpaye\">En attente de paiement</span>";
}

function referenceCourte(id) {
  return String(id || "").replace(/-/g, "").slice(0, 8).toUpperCase();
}

function chargerSejours() {
  sb.from("reservations_logement").select("*, logements_location(titre, localisation, mode_location)").eq("client_id", clientCourant.id).order("date_arrivee", { ascending: false }).limit(30).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeSejours");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p class=\"vide\">Vous n'avez pas encore reserve de logement. <a href=\"immobilier.html#louer\" style=\"color:var(--accent);font-weight:700;text-decoration:none;\">Voir les logements</a></p>";
      return;
    }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var r = data[i];
      var l = r.logements_location || {};
      html += "<div class=\"commande-carte\">" +
                "<div class=\"date\">Reference " + referenceCourte(r.id) + "</div>" +
                "<h3>" + escapeHtml(l.titre || "Logement") + "</h3>" +
                (l.localisation ? "<p>&#128205; " + escapeHtml(l.localisation) + "</p>" : "") +
                "<p>Du " + formatDateFr(r.date_arrivee) + " au " + formatDateFr(r.date_depart) + " (" + r.nb_nuits + " nuit" + (r.nb_nuits > 1 ? "s" : "") + ")</p>" +
                (l.mode_location === "chambre" ? "<p>" + r.nb_chambres + " chambre" + (r.nb_chambres > 1 ? "s" : "") + "</p>" : "") +
                "<div class=\"total\">" + Number(r.prix_total || 0).toLocaleString("fr-FR") + " FCFA</div>" +
                badgeReservationLocation(r) +
              "</div>";
    }
    zone.innerHTML = html;
  });
}

/* ---------- Locations de vehicules ---------- */

var LIBELLES_CAUTION_CLIENT = {
  retenue: "Caution a rembourser au retour",
  remboursee: "Caution remboursee",
  conservee: "Caution conservee"
};

function chargerLocationsVehicules() {
  sb.from("reservations_vehicule").select("*, vehicules_location(titre, localisation)").eq("client_id", clientCourant.id).order("date_retrait", { ascending: false }).limit(30).then(function(reponse) {
    var data = reponse.data;
    var zone = document.getElementById("listeLocationsVehicules");
    if (!data || data.length === 0) {
      zone.innerHTML = "<p class=\"vide\">Vous n'avez pas encore loue de vehicule. <a href=\"transport.html#vehicule\" style=\"color:var(--accent);font-weight:700;text-decoration:none;\">Voir les vehicules</a></p>";
      return;
    }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var r = data[i];
      var v = r.vehicules_location || {};
      var payee = r.statut === "confirmee" || r.statut_paiement === "paye";
      html += "<div class=\"commande-carte\">" +
                "<div class=\"date\">Reference " + referenceCourte(r.id) + "</div>" +
                "<h3>" + escapeHtml(v.titre || "Vehicule") + "</h3>" +
                (v.localisation ? "<p>&#128205; Retrait : " + escapeHtml(v.localisation) + "</p>" : "") +
                "<p>Du " + formatDateFr(r.date_retrait) + " au " + formatDateFr(r.date_retour) + " (" + r.nb_jours + " jour" + (r.nb_jours > 1 ? "s" : "") + ")</p>" +
                "<p>" + (r.avec_chauffeur ? "Avec chauffeur" : "Sans chauffeur") + "</p>" +
                "<div class=\"total\">" + Number(r.prix_total || 0).toLocaleString("fr-FR") + " FCFA</div>" +
                (r.montant_caution ? "<p>Dont caution : " + Number(r.montant_caution).toLocaleString("fr-FR") + " FCFA" +
                  (payee ? " &mdash; " + (LIBELLES_CAUTION_CLIENT[r.statut_caution] || "") : "") + "</p>" : "") +
                badgeReservationLocation(r) +
              "</div>";
    }
    zone.innerHTML = html;
  });
}

chargerEspace();
</script>
