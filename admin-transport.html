<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AW SERVICES - Admin Transport</title>
<link rel="stylesheet" href="style-global.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .aw-header { display: flex; justify-content: space-between; align-items: center; text-align: left; }
  .aw-header h1 { font-size: 17px; }
  .deconnexion { background-color: transparent; border: 1px solid var(--alerte); color: var(--alerte); padding: 8px 14px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 600; font-family: var(--police-texte); }
  .back { display: inline-block; margin: var(--espace-md); color: var(--texte-doux); text-decoration: none; font-size: 14px; }
  .chargement { text-align: center; padding: 40px; color: var(--texte-doux); }
  .refus { text-align: center; padding: 40px; color: var(--alerte); }
  .section { margin-bottom: var(--espace-xl); }
  .vide { color: var(--texte-doux); font-size: 14px; padding: 15px; text-align: center; }

  .onglets { display: flex; gap: 8px; margin-bottom: var(--espace-lg); }
  .onglet { flex: 1; background-color: var(--surface); border: 1px solid var(--bordure); color: var(--texte-doux); padding: 12px; border-radius: var(--rayon-petit); font-size: 13px; font-weight: 600; text-align: center; font-family: var(--police-titre); }
  .onglet.actif { background-color: var(--accent); border-color: var(--accent); color: #1C1200; }
  .panneau { display: none; }
  .panneau.visible { display: block; }

  .filtre-sous-onglets { display: flex; gap: 8px; margin-bottom: var(--espace-md); }
  .sous-onglet { flex: 1; background-color: var(--fond); border: 1px solid var(--bordure); color: var(--texte-doux); padding: 9px; border-radius: var(--rayon-petit); font-size: 12px; font-weight: 600; text-align: center; font-family: var(--police-texte); }
  .sous-onglet.actif { border-color: var(--accent); color: var(--accent); }

  .carte-item { background-color: var(--surface); border: 1px solid var(--bordure); border-radius: var(--rayon-petit); padding: 14px; margin-bottom: 10px; }
  .carte-item h3 { font-size: 15px; font-family: var(--police-titre); margin-bottom: 4px; }
  .carte-item p { font-size: 13px; color: var(--texte-doux); margin-top: 3px; }
  .ligne-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .badge-statut { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge-paye { background-color: rgba(63,163,77,0.15); color: var(--succes); }
  .badge-nonpaye { background-color: rgba(232,72,58,0.15); color: var(--alerte); }
  .badge-neutre { background-color: rgba(107,169,255,0.15); color: #6aa9ff; }
  .badge-attente-c { background-color: rgba(242,169,59,0.15); color: var(--accent); }
  .badge-annulee { background-color: var(--fond); color: var(--texte-discret); }

  .btn-annuler { background-color: transparent; border: 1px solid var(--alerte); color: var(--alerte); padding: 8px 12px; border-radius: var(--rayon-petit); font-size: 12px; font-weight: 700; font-family: var(--police-texte); margin-top: 10px; }
</style>
</head>
<body>

<header class="aw-header">
  <h1>Admin — Transport</h1>
  <button class="deconnexion" id="btnDeconnexion">Deconnexion</button>
</header>

<a href="admin-espace.html" class="back">&#8592; Retour au tableau de bord</a>

<div class="aw-conteneur">
  <div id="zoneContenu" class="chargement">Verification des droits...</div>
</div>

<script>
var sb = supabase.createClient(
  "https://vnceunqygoiwglnwpgcr.supabase.co",
  "sb_publishable_WMntOm7vkufhazqMzzy1Iw_Gip2NmPK"
);

var MOIS_FR = ["Janvier","Fevrier","Mars","Avril","Mai","Juin","Juillet","Aout","Septembre","Octobre","Novembre","Decembre"];
function formatDateFr(dateStr) {
  if (!dateStr) return "";
  var parts = dateStr.split("-");
  if (parts.length !== 3) return dateStr;
  var jour = parseInt(parts[2], 10);
  var mois = MOIS_FR[parseInt(parts[1], 10) - 1];
  return jour + " " + mois + " " + parts[0];
}

document.getElementById("btnDeconnexion").addEventListener("click", function() {
  sb.auth.signOut().then(function() {
    window.location.href = "admin-connexion.html";
  });
});

var filtreReservations = "avenir";

function verifierEtCharger() {
  sb.auth.getUser().then(function(reponseUser) {
    var user = reponseUser.data.user;
    if (!user) {
      window.location.href = "admin-connexion.html";
      return;
    }
    sb.from("admins").select("*").eq("user_id", user.id).single().then(function(reponseAdmin) {
      var admin = reponseAdmin.data;
      var zone = document.getElementById("zoneContenu");
      if (!admin) {
        zone.innerHTML = "<div class=\"refus\">Acces refuse. Ce compte n a pas les droits administrateur.</div>";
        return;
      }
      zone.innerHTML =
        "<div class=\"onglets\">" +
          "<div class=\"onglet actif\" id=\"ongletReservations\">Reservations voiture</div>" +
          "<div class=\"onglet\" id=\"ongletCourses\">Courses moto</div>" +
        "</div>" +

        "<div class=\"panneau visible\" id=\"panneauReservations\">" +
          "<div class=\"filtre-sous-onglets\">" +
            "<div class=\"sous-onglet actif\" id=\"filtreAvenir\">A venir</div>" +
            "<div class=\"sous-onglet\" id=\"filtreToutes\">Toutes (50 dernieres)</div>" +
          "</div>" +
          "<div id=\"listeReservations\"><p class=\"vide\">Chargement...</p></div>" +
        "</div>" +

        "<div class=\"panneau\" id=\"panneauCourses\">" +
          "<div id=\"listeCourses\"><p class=\"vide\">Chargement...</p></div>" +
        "</div>";

      document.getElementById("ongletReservations").addEventListener("click", function() {
        this.classList.add("actif");
        document.getElementById("ongletCourses").classList.remove("actif");
        document.getElementById("panneauReservations").classList.add("visible");
        document.getElementById("panneauCourses").classList.remove("visible");
      });
      document.getElementById("ongletCourses").addEventListener("click", function() {
        this.classList.add("actif");
        document.getElementById("ongletReservations").classList.remove("actif");
        document.getElementById("panneauCourses").classList.add("visible");
        document.getElementById("panneauReservations").classList.remove("visible");
      });
      document.getElementById("filtreAvenir").addEventListener("click", function() {
        filtreReservations = "avenir";
        this.classList.add("actif");
        document.getElementById("filtreToutes").classList.remove("actif");
        chargerReservations();
      });
      document.getElementById("filtreToutes").addEventListener("click", function() {
        filtreReservations = "toutes";
        this.classList.add("actif");
        document.getElementById("filtreAvenir").classList.remove("actif");
        chargerReservations();
      });

      chargerReservations();
      chargerCourses();
    });
  });
}

function chargerReservations() {
  var zone = document.getElementById("listeReservations");
  zone.innerHTML = "<p class=\"vide\">Chargement...</p>";

  var requete = sb.from("reservations_voiture").select("*");
  if (filtreReservations === "avenir") {
    var aujourdHui = new Date().toISOString().split("T")[0];
    requete = requete.gte("date_voyage", aujourdHui).order("date_voyage", { ascending: true }).limit(100);
  } else {
    requete = requete.order("date_voyage", { ascending: false }).limit(50);
  }

  requete.then(function(reponse) {
    var data = reponse.data || [];
    if (data.length === 0) { zone.innerHTML = "<p class=\"vide\">Aucune reservation.</p>"; return; }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var r = data[i];
      var texteTrajet = r.direction === "aller" ? "Dakar &#8594; Bokidiawe" : "Bokidiawe &#8594; Dakar";
      var badgePaiement = r.statut_paiement === "paye" ? "<span class=\"badge-statut badge-paye\">Paye</span>" : "<span class=\"badge-statut badge-nonpaye\">Non paye</span>";
      var badgeAnnulee = r.statut === "annulee" ? "<span class=\"badge-statut badge-annulee\">Annulee</span>" : "";
      html += "<div class=\"carte-item\">" +
                "<h3>" + (r.prenom || "") + " " + (r.nom_famille || r.client_nom || "") + " &mdash; Chaise " + r.siege + "</h3>" +
                "<p>" + texteTrajet + " &mdash; " + formatDateFr(r.date_voyage) + "</p>" +
                "<p>Telephone : " + r.client_telephone + "</p>" +
                (r.village_depart ? "<p>Village de depart : " + r.village_depart + "</p>" : "") +
                (r.prix_total ? "<p>Prix : " + Number(r.prix_total).toLocaleString("fr-FR") + " FCFA</p>" : "") +
                "<div class=\"ligne-badges\">" + badgePaiement + badgeAnnulee + "</div>" +
                (r.statut !== "annulee" ? "<button type=\"button\" class=\"btn-annuler btn-annuler-resa\" data-id=\"" + r.id + "\">Annuler cette reservation</button>" : "") +
              "</div>";
    }
    zone.innerHTML = html;

    var boutons = document.getElementsByClassName("btn-annuler-resa");
    for (var b = 0; b < boutons.length; b++) {
      boutons[b].addEventListener("click", function(e) {
        var id = e.target.getAttribute("data-id");
        if (!confirm("Annuler cette reservation ?")) return;
        sb.from("reservations_voiture").update({ statut: "annulee" }).eq("id", id).then(function() {
          chargerReservations();
        });
      });
    }
  });
}

var LIBELLES_COURSE = {
  nouvelle: "En attente d'un livreur",
  acceptee: "Livreur en route vers le client",
  en_cours: "Client recupere, en route",
  terminee: "Terminee",
  annulee: "Annulee"
};
var CLASSES_COURSE = {
  nouvelle: "badge-attente-c",
  acceptee: "badge-neutre",
  en_cours: "badge-neutre",
  terminee: "badge-paye",
  annulee: "badge-annulee"
};

function chargerCourses() {
  var zone = document.getElementById("listeCourses");
  zone.innerHTML = "<p class=\"vide\">Chargement...</p>";

  sb.from("courses_moto").select("*").limit(50).then(function(reponse) {
    var data = reponse.data || [];
    if (data.length === 0) { zone.innerHTML = "<p class=\"vide\">Aucune course moto.</p>"; return; }
    var html = "";
    for (var i = 0; i < data.length; i++) {
      var c = data[i];
      var classeBadge = CLASSES_COURSE[c.statut] || "badge-neutre";
      var texteBadge = LIBELLES_COURSE[c.statut] || c.statut;
      html += "<div class=\"carte-item\">" +
                "<h3>" + c.client_nom + "</h3>" +
                "<p>Telephone : " + c.client_telephone + "</p>" +
                "<p>Destination : " + c.lieu_arrivee + "</p>" +
                (c.distance_km ? "<p>Distance : " + c.distance_km + " km</p>" : "") +
                (c.prix_total ? "<p>Prix : " + Number(c.prix_total).toLocaleString("fr-FR") + " FCFA (" + c.mode_paiement + ")</p>" : "<p>Paiement : " + c.mode_paiement + "</p>") +
                "<p>" + (c.livreur_id ? "Livreur assigne" : "Aucun livreur assigne") + "</p>" +
                "<div class=\"ligne-badges\"><span class=\"badge-statut " + classeBadge + "\">" + texteBadge + "</span></div>" +
              "</div>";
    }
    zone.innerHTML = html;
  });
}

verifierEtCharger();
</script>

</body>
</html>
